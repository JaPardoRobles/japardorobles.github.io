<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thousand Sons 11ª ed. — Codex interactivo &amp; Army Builder</title>
<style>
:root{
--bg:#080b12;--panel:#0e1420;--panel2:#131b2a;--line:#27344a;
--gold:#c9a24a;--gold2:#e8cf8b;--blue:#1d3557;--blue2:#122238;--ink:#e9e6dc;
--muted:#93a0b5;--red:#e2726e;--green:#7fd6a2;--cyan:#6fc7d8;--warn:#e6b455;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
header{padding:16px 0;border-bottom:2px solid var(--gold);background:linear-gradient(180deg,#101a2b,#080b12);position:sticky;top:0;z-index:30}
.wrap{max-width:1500px;margin:auto;padding:16px}
h1{margin:0;color:var(--gold2);font-size:22px;letter-spacing:.5px}
h2{margin:0 0 12px;color:var(--gold2);font-size:19px}
h3{margin:0 0 8px;font-size:15px}
.muted,.small{color:var(--muted);font-size:12px}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
aside.panel{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow:auto}
label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;margin:10px 0 4px}
select,input,textarea{width:100%;background:#080d16;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit}
select:disabled,option:disabled{color:#5d6779}
button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer;font:inherit}
button:hover{border-color:var(--gold)}
button.primary{background:#22344f;border-color:var(--gold)}
button.danger{border-color:#6d3234;color:#f0a6a4}
.row{display:flex;gap:7px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border-radius:999px;font-size:13px}
.tab.active{background:var(--gold);color:#14100a;border-color:var(--gold);font-weight:600}
.hidden{display:none}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:8px 10px}
.kpi span{display:block;font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:18px;color:var(--gold2);line-height:1.3}
.kpi.bad{border-left-color:var(--red)}.kpi.bad b{color:var(--red)}
.note{border:1px solid var(--line);border-left:3px solid var(--cyan);background:#0d1622;padding:9px 11px;border-radius:0 7px 7px 0;margin:8px 0}
.note.bad{border-left-color:var(--red);background:#1c1013}
.note.ok{border-left-color:var(--green);background:#0d1a15}
.note.warn{border-left-color:var(--warn);background:#1c1710}

/* ---------- CODEX DATASHEET ---------- */
.ds{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:18px}
.ds-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,var(--blue),var(--blue2));border-bottom:2px solid var(--gold)}
.ds-head h3{margin:0;color:var(--gold2);font-size:17px;text-transform:uppercase;letter-spacing:1px}
.ds-head .pts{color:var(--gold2);font-weight:700;white-space:nowrap}
.ds-body{padding:12px 14px}
.statline{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 10px}
.statbox{min-width:52px;text-align:center;border:1px solid var(--gold);border-radius:6px;background:#0a1220;overflow:hidden}
.statbox i{display:block;font-style:normal;font-size:10px;letter-spacing:1px;background:var(--gold);color:#14100a;font-weight:700;padding:1px 0}
.statbox b{display:block;font-size:16px;padding:3px 6px}
.profname{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:8px 0 3px}
.secbar{margin:14px 0 6px;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:#14100a;background:var(--gold);padding:3px 9px;border-radius:3px;font-weight:700;display:inline-block}
table.wep{width:100%;border-collapse:collapse;font-size:13px}
table.wep th{background:var(--blue2);color:var(--gold2);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:5px 6px;text-align:center;border-bottom:1px solid var(--gold)}
table.wep th:first-child{text-align:left}
table.wep td{padding:5px 6px;text-align:center;border-bottom:1px solid #1c2635;vertical-align:top}
table.wep td:first-child{text-align:left}
table.wep tr:hover td{background:#101a29}
.wkw{display:block;color:var(--cyan);font-size:11px;margin-top:1px}
.wcount{display:inline-block;background:var(--gold);color:#14100a;border-radius:4px;font-size:11px;font-weight:700;padding:0 5px;margin-right:6px}
.ab{margin:6px 0;padding-left:10px;border-left:2px solid var(--blue)}
.ab b{color:var(--gold2)}
.kwbar{margin-top:12px;padding:7px 9px;background:var(--blue2);border-radius:5px;font-size:11px;letter-spacing:.6px}
.kwbar b{color:var(--gold2)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:#cfd7e4;margin:2px 3px 2px 0}
.chip.on{border-color:var(--gold);color:var(--gold2)}

/* ---------- WARGEAR COUNTERS ---------- */
.wg{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:7px 0;background:#0b1220}
.wg-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wg-name{font-weight:600}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:28px;padding:3px 0;text-align:center;line-height:1}
.stepper input{width:46px;text-align:center;padding:4px}
label.check{display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px;margin:6px 0}
label.check input{width:auto;margin-top:3px;flex:none}
label.check .small{color:var(--muted)}
.wg .small{margin-top:3px}
.maxed{color:var(--warn)}

/* ---------- STRATAGEM CARD ---------- */
.strat{border:1px solid var(--line);border-radius:8px;margin:9px 0;overflow:hidden}
.strat-h{display:flex;justify-content:space-between;gap:10px;padding:7px 11px;background:var(--blue2);border-bottom:1px solid var(--gold)}
.strat-h b{color:var(--gold2);text-transform:uppercase;letter-spacing:.8px;font-size:13px}
.strat-b{padding:9px 11px}
.strat-b p{margin:4px 0}
.strat-b .lbl{color:var(--gold);font-size:11px;letter-spacing:.8px;text-transform:uppercase}
.cp{background:var(--gold);color:#14100a;border-radius:4px;padding:1px 7px;font-weight:700;font-size:12px;white-space:nowrap}

details{border:1px solid var(--line);border-radius:8px;padding:0;margin:9px 0;overflow:hidden}
summary{cursor:pointer;color:var(--gold2);font-weight:600;padding:9px 12px;background:#101827;list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";color:var(--gold)}
details[open]>summary:before{content:"▾ "}
details>*:not(summary){padding:0 12px}
details>*:last-child{padding-bottom:10px}

.listrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.listrow.over{background:#1c1013}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}

/* ---------- GLOSSARY TOOLTIP ---------- */
.gterm{border-bottom:1px dotted var(--gold);cursor:help}
#tip{position:fixed;z-index:999;max-width:340px;background:#0a1220;border:1px solid var(--gold);border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.45;box-shadow:0 8px 26px #000c;pointer-events:none;display:none}
#tip b{color:var(--gold2);display:block;margin-bottom:3px}
#tip i{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-bottom:4px}

/* ---------- TABLA DE HERIR (ramp ordinal de un solo tono, validado) ---------- */
/* L OKLab 0.919 → 0.441, monótona, ΔL ≥ 0.081, extremo oscuro 2.35:1 sobre la
   superficie. Cada celda lleva además su valor escrito: el color nunca es el
   único portador del dato. */
.wt-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:8px}
table.wt{border-collapse:separate;border-spacing:2px;font-size:12px;font-variant-numeric:tabular-nums}
table.wt th{background:var(--blue2);color:var(--gold2);font-size:11px;padding:4px 6px;text-align:center;position:sticky;top:0;z-index:2}
table.wt th.cnr{left:0;z-index:3}
table.wt th.rh{position:sticky;left:0;top:auto;z-index:1;background:var(--blue2);text-align:right;min-width:52px}
table.wt td{text-align:center;padding:4px 6px;border-radius:4px;font-weight:700;min-width:34px}
.w2{background:#f7e3ab;color:#14100a}
.w3{background:#e0bb66;color:#14100a}
.w4{background:#c2953c;color:#14100a}
.w5{background:#8a6026;color:#f0eada}
.w6{background:#6b4c20;color:#f0eada}
.wx{background:#1b2130;color:#8794a8;font-weight:400}
table.wt td.hl{outline:2px solid var(--gold)}
.wt-legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.wt-legend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.wt-legend i{width:16px;height:16px;border-radius:4px;display:inline-block}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bigans{font-size:30px;color:var(--gold2);font-weight:800;line-height:1.2}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1050px){
 .layout{grid-template-columns:1fr}
 aside.panel{position:static;max-height:none}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .two{grid-template-columns:1fr}
 header{position:static}
}
@media(max-width:700px){
 .wrap{padding:10px}
 h1{font-size:17px;line-height:1.3}
 header{padding:10px 0}
 h2{font-size:17px}
 .panel{padding:10px;border-radius:8px}
 .kpis{grid-template-columns:repeat(2,1fr);gap:6px}
 .kpi b{font-size:16px}
 /* Pestañas en una fila deslizable: no se apilan y ocupan media pantalla */
 .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;gap:5px}
 .tabs::-webkit-scrollbar{height:3px}
 .tab{flex:0 0 auto;font-size:12px;padding:8px 12px}
 .grid{grid-template-columns:1fr}
 .ds-head{flex-wrap:wrap;gap:4px;padding:8px 10px}
 .ds-head h3{font-size:14px;letter-spacing:.5px}
 .ds-body{padding:10px}
 /* 16px evita que iOS haga zoom al enfocar un campo */
 select,input,textarea{font-size:16px;padding:10px}
 button{padding:10px 12px;min-height:40px}
 .stepper button{width:40px;min-height:40px;font-size:18px}
 .stepper input{width:52px;font-size:16px}
 .wg-top{flex-wrap:wrap}
 .statline{gap:5px}
 .statbox{min-width:44px}
 .statbox b{font-size:14px;padding:2px 4px}
 table.wep{font-size:12px}
 table.wep th,table.wep td{padding:4px}
 .listrow{grid-template-columns:1fr auto;row-gap:4px}
 .listrow>button{grid-column:2}
 details>*:not(summary){padding:0 10px}
 summary{padding:10px}
 #tip{max-width:86vw;font-size:13px}
 .wt-wrap{max-height:60vh}
}
@media(max-width:430px){
 .kpis{grid-template-columns:1fr}
 .statbox{min-width:40px}
 .wt-legend span{font-size:11px}
}
/* Dispositivos táctiles: el hover no existe, así que el término se pulsa */
@media(hover:none){.gterm{border-bottom-style:dashed}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0 16px">
<h1>♾ THOUSAND SONS · 11ª EDICIÓN — Codex interactivo &amp; Army Builder</h1>
<div class="muted">Datos: Faction Pack Thousand Sons 22/07/2026 (v1.1) + MFM vigente · Perfiles contrastados con Wahapedia 11E · Pasa el ratón por cualquier término subrayado para ver qué significa.</div>
</div></header>

<div class="wrap"><div class="layout">
<aside class="panel">
  <h2>Tu ejército</h2>
  <label>Destacamento</label><select id="det"></select>
  <div id="detFit" class="small" style="margin-top:6px"></div>
  <label>Límite de puntos</label><input id="limit" type="number" value="1000" min="250" step="50">
  <div class="row" style="margin:12px 0"><button class="primary" onclick="loadExample()">Lista de ejemplo</button><button onclick="newArmy()">Vaciar</button></div>
  <div id="armyList"></div>
  <label>Añadir unidad</label>
  <select id="addPick"></select>
  <button class="primary" style="width:100%;margin-top:7px" onclick="addPicked()">+ Añadir al ejército</button>
  <div id="validation" style="margin-top:12px"></div>
  <div class="secbar" style="margin-top:14px">Listas guardadas</div>
  <div id="slots"></div>
  <label>Guardar la lista actual como</label>
  <div class="row"><input id="slotName" placeholder="p. ej. Rubricae 1000" style="flex:1;min-width:120px"><button class="primary" onclick="saveSlot()">Guardar</button></div>
  <details style="margin-top:12px"><summary>Importar / exportar</summary>
    <label>Pegar lista exportada</label>
    <textarea id="importText" rows="5" placeholder="Pega aquí el texto de tu app de listas..."></textarea>
    <div class="row" style="margin:7px 0"><button onclick="importArmy()">Importar texto</button><button onclick="exportArmy()">Exportar JSON</button></div>
    <input id="file" type="file" accept=".json" onchange="importJSON(event)" style="display:none">
    <button onclick="document.getElementById('file').click()">Importar JSON</button>
  </details>
</aside>

<main>
  <div id="kpis" class="kpis"></div>
  <div class="tabs">
    <button class="tab active" data-t="builder">🛠 Editar unidades</button>
    <button class="tab" data-t="codex">📖 Codex de mi lista</button>
    <button class="tab" data-t="detachment">⚜ Destacamento</button>
    <button class="tab" data-t="rituals">🔮 Rituales</button>
    <button class="tab" data-t="combos">🧩 Combos</button>
    <button class="tab" data-t="catalog">📚 Catálogo completo</button>
    <button class="tab" data-t="coach">🎯 Battle Coach</button>
    <button class="tab" data-t="rules">📕 Glosario</button>
  </div>
  <section id="builder" class="panel pane"></section>
  <section id="codex" class="panel pane hidden"></section>
  <section id="detachment" class="panel pane hidden"></section>
  <section id="rituals" class="panel pane hidden"></section>
  <section id="combos" class="panel pane hidden"></section>
  <section id="catalog" class="panel pane hidden"></section>
  <section id="coach" class="panel pane hidden"></section>
  <section id="rules" class="panel pane hidden"></section>
</main>
</div></div>
<div id="tip"></div>

<script>
"use strict";
/* =========================================================================
   1. GLOSARIO — cada acrónimo / regla con explicación al pasar el ratón
   ========================================================================= */
const GLOSSARY={
/* --- características --- */
"M":{n:"Movement (Movimiento)",t:"Cuántas pulgadas puede moverse el modelo en la fase de Movimiento."},
"T":{n:"Toughness (Resistencia)",t:"Se compara con la Fuerza (S) del arma para saber con qué número hiere el atacante."},
"Sv":{n:"Save (Salvación por armadura)",t:"Tirada de D6 para evitar una herida. Se empeora restando el AP del arma."},
"W":{n:"Wounds (Heridas)",t:"Puntos de vida del modelo. Al llegar a 0 el modelo es destruido."},
"Ld":{n:"Leadership (Liderazgo)",t:"Objetivo en 2D6 para superar pruebas de Battle-shock y similares. Menor es mejor (6+ es mejor que 7+)."},
"OC":{n:"Objective Control (Control de objetivo)",t:"Cuánto 'pesa' cada modelo al disputar un objetivo. Se suma el OC de todos los modelos en rango; quien tenga más, controla."},
"InvSv":{n:"Invulnerable Save (Salvación invulnerable)",t:"Salvación alternativa que NO se ve afectada por el AP del arma. Usas la mejor de las dos, nunca ambas."},
"A":{n:"Attacks (Ataques)",t:"Número de tiradas de impactar que hace el arma. Puede ser un número fijo o dados (D6, D3, 2D6...)."},
"BS":{n:"Ballistic Skill (Habilidad de proyectiles)",t:"Número que necesitas en D6 para impactar con un arma a distancia. '—' significa que el arma no tira para impactar (Torrent)."},
"WS":{n:"Weapon Skill (Habilidad de armas)",t:"Número que necesitas en D6 para impactar en combate cuerpo a cuerpo."},
"S":{n:"Strength (Fuerza)",t:"Se compara con la Resistencia (T) del objetivo para determinar la tirada de herir."},
"AP":{n:"Armour Penetration (Penetración de armadura)",t:"Empeora la salvación por armadura del objetivo. AP -2 convierte un 3+ en un 5+. No afecta a las invulnerables."},
"D":{n:"Damage (Daño)",t:"Heridas que quita cada herida no salvada."},
"CP":{n:"Command Points (Puntos de mando)",t:"Moneda para usar Stratagems. Ganas 1 al inicio de tu Command phase."},
"DP":{n:"Detachment Points (Puntos de destacamento)",t:"Valor del destacamento en el Faction Pack de 11ª. Cuanto más alto, más herramientas/reglas potentes aporta el destacamento."},
"VP":{n:"Victory Points (Puntos de victoria)",t:"Lo que realmente decide la partida. Casi siempre puntuar vale más que matar."},
"MW":{n:"Mortal Wounds (Heridas mortales)",t:"Daño que ignora salvación por armadura e invulnerable. Solo Feel No Pain puede reducirlo."},
"FNP":{n:"Feel No Pain (Insensible al dolor)",t:"Tras perder una herida, tira 1D6: si sacas el valor indicado o más, no la pierdes."},
"ER":{n:"Engagement Range (Rango de compromiso)",t:"1\" horizontal y 5\" vertical. Estar dentro significa estar trabado en combate."},
"WC":{n:"Warp Charge (Carga de disformidad)",t:"Resultado mínimo que debe alcanzar tu Psychic test para que el Ritual se manifieste."},
"LoS":{n:"Line of Sight (Línea de visión)",t:"Si puedes trazar una línea recta desde el modelo atacante hasta cualquier parte del objetivo."},
"pts":{n:"Points (Puntos)",t:"Coste de la unidad para construir la lista dentro del límite acordado."},
/* --- palabras clave de arma --- */
"TORRENT":{n:"Torrent (Torrente)",t:"Impacta automáticamente: no se tira para impactar. Por eso su BS aparece como '—'."},
"BLAST":{n:"Blast (Explosivo)",t:"+1 ataque por cada 5 modelos completos en la unidad objetivo. No puede disparar a unidades trabadas."},
"IGNORES COVER":{n:"Ignores Cover (Ignora cobertura)",t:"El objetivo no puede usar el beneficio de cobertura contra estos ataques."},
"DEVASTATING WOUNDS":{n:"Devastating Wounds (Heridas devastadoras)",t:"Una herida crítica (6 natural al herir, o el valor de Anti-X) se convierte en heridas mortales: ignoran armadura E invulnerable."},
"LETHAL HITS":{n:"Lethal Hits (Impactos letales)",t:"Un impacto crítico (6 natural al impactar) hiere automáticamente, sin tirar para herir."},
"SUSTAINED HITS":{n:"Sustained Hits X (Impactos sostenidos)",t:"Cada impacto crítico (6 natural) genera X impactos adicionales."},
"RAPID FIRE":{n:"Rapid Fire X (Fuego rápido)",t:"+X ataques cuando el objetivo está a media distancia o menos del arma."},
"PRECISION":{n:"Precision (Precisión)",t:"En una unidad con personaje adjunto, puedes asignar estas heridas directamente al personaje."},
"LANCE":{n:"Lance (Lanza)",t:"+1 a la tirada de herir si la unidad cargó este turno."},
"HAZARDOUS":{n:"Hazardous (Peligroso)",t:"Tras disparar/luchar, tira 1D6 por arma usada: con 1, el portador sufre 3 heridas mortales (o es destruido si no es Character/Monster/Vehicle)."},
"PISTOL":{n:"Pistol (Pistola)",t:"Puede disparar aunque la unidad esté trabada, pero solo a la unidad con la que está trabada, y entonces no puede disparar otras armas."},
"TWIN-LINKED":{n:"Twin-linked (Enlazado)",t:"Permite repetir la tirada de herir."},
"EXTRA ATTACKS":{n:"Extra Attacks (Ataques extra)",t:"Estos ataques son adicionales: se hacen además de los del arma principal de combate."},
"MELTA":{n:"Melta X",t:"+X al Daño cuando el objetivo está a media distancia o menos."},
"PSYCHIC":{n:"Psychic (Psíquico)",t:"Es un Ataque Psíquico. Muchas reglas de Thousand Sons (y defensas enemigas) solo afectan a armas con esta palabra clave."},
"ASSAULT":{n:"Assault (Asalto)",t:"El arma puede dispararse aunque la unidad haya avanzado (Advance) ese turno."},
"HEAVY":{n:"Heavy (Pesado)",t:"+1 a impactar si la unidad se quedó quieta (Remained Stationary) este turno."},
"INDIRECT FIRE":{n:"Indirect Fire (Fuego indirecto)",t:"Puede disparar sin línea de visión, con -1 a impactar y el objetivo obtiene cobertura."},
"ANTI-INFANTRY 4+":{n:"Anti-Infantry 4+",t:"Contra unidades INFANTRY, una tirada de herir de 4+ es una herida crítica: hiere automáticamente. Combinado con DEVASTATING WOUNDS, cada 4+ se convierte en heridas mortales."},
"ANTI-VEHICLE 4+":{n:"Anti-Vehicle 4+",t:"Contra unidades VEHICLE, una tirada de herir de 4+ es una herida crítica: hiere automáticamente."},
"ANTI-VEHICLE 3+":{n:"Anti-Vehicle 3+",t:"Contra unidades VEHICLE, una tirada de herir de 3+ es una herida crítica: hiere automáticamente."},
"ANTI-MONSTER 4+":{n:"Anti-Monster 4+",t:"Contra unidades MONSTER, una tirada de herir de 4+ es una herida crítica: hiere automáticamente."},
"ANTI-FLY 2+":{n:"Anti-Fly 2+",t:"Contra unidades FLY, una tirada de herir de 2+ es una herida crítica: hiere automáticamente."},
"CLEAVE":{n:"Cleave X (Hendidura)",t:"Regla de 11ª: el ataque aplica daño adicional contra objetivos de gran tamaño según el valor X."},
/* --- habilidades core --- */

/* Términos que se detectan automáticamente en el texto.
   Se excluyen los de una sola letra (M, T, A, S, D...) porque aparecerían en
   cualquier palabra: esos se marcan a mano en las cabeceras de las tablas. */
const NO_AUTO=["pts","Heridas","Transport","Damaged","Split"];
/* Se reconstruyen tras poblar el glosario con las reglas con nombre propio
   (ver autoGlossary): así «Malefic Maelstrom» o «Kindred Sorcery» también
   tienen hover en cualquier sitio donde solo aparezca su nombre. */
let AUTO_TERMS=[],AUTO_RE=null,GL_MAP={};
function buildGlossaryIndex(){
  AUTO_TERMS=Object.keys(GLOSSARY).filter(k=>k.length>1&&NO_AUTO.indexOf(k)<0);
  GL_MAP={};
  AUTO_TERMS.forEach(k=>{GL_MAP[k.toLowerCase()]=k});
  AUTO_RE=new RegExp("(?<![\\w\\-])("+AUTO_TERMS
    .slice().sort((a,b)=>b.length-a.length)
    .map(t=>t.replace(/[.*+?^${}()|[\]\\-]/g,"\\$&"))
    .join("|")+")(?![\\w])","gi");
}

/* Resuelve una coincidencia de texto a su clave de glosario */
function glKey(txt){return GL_MAP[txt.toLowerCase()]||null}

/* Recoge los nodos de texto susceptibles de llevar tooltip */
function textNodes(root){
  const skip={SCRIPT:1,STYLE:1,INPUT:1,SELECT:1,TEXTAREA:1,OPTION:1,SUMMARY:1};
  const out=[];
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!n.nodeValue.trim())return NodeFilter.FILTER_REJECT;
    let p=n.parentNode;
    while(p&&p!==root.parentNode){
      if(p.nodeType===1){
        if(skip[p.tagName])return NodeFilter.FILTER_REJECT;
        if(p.classList&&p.classList.contains("gterm"))return NodeFilter.FILTER_REJECT;
        if(p.hasAttribute&&p.hasAttribute("data-noglossary"))return NodeFilter.FILTER_REJECT;
      }
      p=p.parentNode;
    }
    return NodeFilter.FILTER_ACCEPT;
  }});
  let n; while((n=w.nextNode()))out.push(n);
  return out;
}

/* Envuelve en <span class="gterm"> las coincidencias de re.
   resolve(match) devuelve {g:"CLAVE"} o {n:"título",t:"explicación"} */
function wrapMatches(root,re,resolve){
  textNodes(root).forEach(node=>{
    const txt=node.nodeValue;
    re.lastIndex=0;
    if(!re.test(txt))return;
    re.lastIndex=0;
    const frag=document.createDocumentFragment();
    let last=0,m,any=false;
    while((m=re.exec(txt))){
      const info=resolve(m);
      if(!info)continue;
      if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));
      const s=document.createElement("span");
      s.className="gterm";
      if(info.g)s.dataset.g=info.g; else {s.dataset.gt=info.n;s.dataset.gd=info.t}
      s.textContent=m[0];
      frag.appendChild(s);
      last=m.index+m[0].length;
      any=true;
    }
    if(!any)return;
    if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag,node);
  });
}

/* Primero los valores concretos (T4, Sv3+, AP-2...) y luego los términos del
   glosario: al revés, "AP" se comería el "AP-2" y perderías la explicación útil. */
function applyGlossary(root){
  if(!root||!AUTO_RE) return;
  DYN.forEach(d=>wrapMatches(root,d.re,d.f));
  wrapMatches(root,AUTO_RE,m=>{const k=glKey(m[1]);return k?{g:k}:null});
}

/* ---------------------------------------------------------------------------
   Glosario automático: toda regla con nombre propio (habilidades de datasheet,
   reglas de destacamento, Enhancements, Stratagems, Rituales) entra al glosario
   con su texto real, para no mantener dos copias del mismo dato.
   --------------------------------------------------------------------------- */
function plain(s){return String(s).replace(/<br\s*\/?>/gi," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim()}
function clip(s,n){s=plain(s);return s.length>n?s.slice(0,n-1)+"…":s}
function addGl(name,kind,text){
  let k=String(name)
    .replace(/\s*\((?:Aura,\s*)?(?:Psychic|Aura|Wargear)\)\s*$/i,"")
    .replace(/^Crimson King\s*[①②③]\s*/,"")
    .replace(/\s*\(\d+\s*CP\)\s*$/i,"")
    .trim();
  if(!k||k.length<4)return;
  if(k.indexOf(":")>=0||/^\d/.test(k))return;
  if(NO_AUTO.indexOf(k)>=0)return;
  if(GLOSSARY[k])return;              // nunca sobrescribe una entrada escrita a mano
  GLOSSARY[k]={n:kind,t:clip(text,460)};
}
function autoGlossary(){
  Object.keys(DET).forEach(dn=>{
    const d=DET[dn];
    addGl(d.rule.n,"Regla de destacamento · "+dn,d.rule.t);
    (d.enh||[]).forEach(e=>addGl(e.n,"Enhancement · "+e.p+" pts · "+dn,e.rq+". "+e.t));
    (d.strats||[]).forEach(s=>addGl(s.n,"Stratagem · "+s.cp+" CP · "+dn,
      "CUÁNDO: "+s.when+" OBJETIVO: "+s.tgt+" EFECTO: "+s.eff));
  });
  CORE_STRATS.forEach(s=>addGl(s.n,"Stratagem Core · "+s.cp+" CP",
    "CUÁNDO: "+s.when+" OBJETIVO: "+s.tgt+" EFECTO: "+s.eff));
  RITUALS.forEach(r=>addGl(r.n,"Ritual · Warp Charge "+r.wc,r.t));
  ARMY_RULES.forEach(r=>addGl(r.n,"Regla de ejército Thousand Sons",r.t));
  Object.keys(CORE_AB).forEach(k=>addGl(k,"Habilidad Core",CORE_AB[k]));
  Object.keys(DS).forEach(n=>{
    const A=DS[n].ab||{};
    (A.unit||[]).forEach(a=>addGl(a.n,"Habilidad · "+n,a.t));
    (A.wg||[]).forEach(a=>addGl(a.n,"Wargear · "+n,a.t));
  });
  BUFFS.forEach(b=>addGl(b.n,b.src,b.d));
  /* Las tres opciones de Kindred Sorcery viven dentro del texto de la regla,
     así que no las genera el barrido: se añaden explícitamente. */
  addGl("Imbued Manifestation","Opción de Kindred Sorcery · Grand Coven",
   `Añade 6" al alcance de las armas Psychic a distancia de los modelos THOUSAND SONS de tu ejército. Solo puedes elegir cada opción de Kindred Sorcery una vez por batalla.`);
  addGl("Psychic Maelstrom","Opción de Kindred Sorcery · Grand Coven",
   `Cada vez que un modelo THOUSAND SONS de tu ejército ataque con un arma Psychic, suma 1 a la tirada de herir. Solo puedes elegir cada opción de Kindred Sorcery una vez por batalla.`);
  addGl("Wrath of the Immaterium","Opción de Kindred Sorcery · Grand Coven",
   `Las armas Psychic de los modelos THOUSAND SONS de tu ejército obtienen DEVASTATING WOUNDS: cada herida crítica se convierte en heridas mortales. Solo puedes elegir cada opción de Kindred Sorcery una vez por batalla.`);
  addGl("Crimson King","Sección del datasheet de Magnus the Red",
   `Las tres habilidades entre las que Unearthly Power te hace elegir al inicio de cada battle round: Impossible Form, Treason of Tzeentch y Time Flux. Solo una está activa a la vez.`);
}

/* Tooltip flotante */
const tipEl=document.getElementById("tip");
function showTip(el){
  let head,name,body;
  if(el.dataset.g){
    const g=GLOSSARY[el.dataset.g]; if(!g)return;
    head=el.dataset.g; name=g.n; body=g.t;
  }else if(el.dataset.gd){
    head=el.textContent; name=el.dataset.gt; body=el.dataset.gd;
  }else return;
  tipEl.innerHTML="<b>"+esc(head)+"</b><i>"+esc(name)+"</i>"+esc(body);
  tipEl.style.display="block";
  const r=el.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
  let x=r.left, y=r.bottom+7;
  if(x+t.width>innerWidth-10)x=innerWidth-t.width-10;
  if(x<8)x=8;
  if(y+t.height>innerHeight-10)y=r.top-t.height-7;
  tipEl.style.left=x+"px";tipEl.style.top=Math.max(8,y)+"px";
}
function hideTip(){tipEl.style.display="none"}
document.addEventListener("mouseover",e=>{const t=e.target.closest&&e.target.closest(".gterm");if(t)showTip(t)});
document.addEventListener("mouseout",e=>{if(e.target.closest&&e.target.closest(".gterm"))hideTip()});
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest(".gterm");if(t){showTip(t);setTimeout(hideTip,4000)}else hideTip()});
window.addEventListener("scroll",hideTip,true);

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

const DET={
"Grand Coven":{dp:3,disp:["Priority Assets"],
 fit:`La opción generalista. Convierte a toda tu red de PSYKER en una herramienta flexible: cada Command phase eliges un buff distinto para todo el ejército, y cada uno solo puede usarse una vez por batalla.`,
 rule:{n:"Kindred Sorcery",t:`En tu Command phase puedes seleccionar una de las habilidades siguientes, que estará activa hasta el inicio de tu siguiente Command phase. Solo puedes seleccionar cada una de estas habilidades una vez por batalla.
• Imbued Manifestation: añade 6" al alcance de las armas Psychic a distancia de los modelos THOUSAND SONS de tu ejército.
• Psychic Maelstrom: cada vez que un modelo THOUSAND SONS de tu ejército ataque con un arma Psychic, suma 1 a la tirada de herir.
• Wrath of the Immaterium: las armas Psychic de los modelos THOUSAND SONS de tu ejército obtienen DEVASTATING WOUNDS.`,
  applies:u=>kw(u,"THOUSAND SONS")},
 enh:[
  {n:"Eldritch Vortex of E'taph",p:35,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Suma 1 a las características de Fuerza y Daño de las armas Psychic del portador.`},
  {n:"Lord of Forbidden Lore",p:20,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Cada vez que el portador manifieste un Ritual, mientras resuelves ese Ritual, añade 6" a su alcance.`},
  {n:"Umbralefic Crystal",p:20,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`(Una vez por batalla, por ejército) En tu Command phase, si esta unidad no está trabada, puedes usar esta habilidad. Si lo haces: coloca esta unidad en Strategic Reserves. Esta unidad tiene DEEP STRIKE hasta el inicio de tu siguiente Shooting phase, y debe hacer un movimiento de entrada en tu siguiente Movement phase (incluido en tu primer turno).`},
  {n:"Incandaeum",p:15,rq:"Solo modelo EXALTED SORCERER",req:u=>CH(u)&&kw(u,"EXALTED SORCERER"),
   t:`Una vez por batalla, al seleccionar un Ritual para que lo intente el portador, puedes elegir Doombolt aunque un modelo de tu ejército ya haya intentado manifestar ese Ritual esta fase.`}],
 strats:[
  {n:"Psychic Dominion",cp:1,type:"Epic Deed",
   when:`Cualquier fase, justo después de que una unidad enemiga haya seleccionado sus objetivos.`,
   tgt:`Una unidad THOUSAND SONS de tu ejército seleccionada como objetivo de uno o más ataques de la unidad atacante.`,
   eff:`Hasta el final de la fase, las armas Psychic de los modelos de la unidad atacante obtienen HAZARDOUS, y los modelos de tu unidad tienen FEEL NO PAIN 4+ contra Ataques Psíquicos.`,
   easy:`Defensivo y brutal contra ejércitos psíquicos (otros Thousand Sons, Grey Knights, Aeldari). Si el rival no tiene armas Psychic, esta carta es casi papel mojado.`,
   can:u=>kw(u,"THOUSAND SONS")},
  {n:"Destined by Fate",cp:1,type:"Epic Deed",
   when:`Cualquier fase, justo después de fallar una salvación por un modelo THOUSAND SONS PSYKER de tu ejército.`,
   tgt:`Ese modelo PSYKER.`,
   eff:`Cambia la característica de Daño de ese ataque a 0.`,
   easy:`Anula por completo un golpe. Guárdala para el disparo que iba a matar a Ahriman o a Magnus, no para ahorrar 1 herida.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Egotistical Power",cp:1,type:"Strategic Ploy",
   when:`Tu Command phase.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército.`,
   eff:`Selecciona Imbued Manifestation, Psychic Maelstrom o Wrath of the Immaterium. Hasta el inicio de tu siguiente Command phase esa habilidad se aplica a tu unidad en lugar de cualquier otra habilidad de Kindred Sorcery, incluso si ya has seleccionado esa habilidad esta batalla.`,
   easy:`Te deja repetir un buff ya gastado, pero solo en una unidad. Ideal si ya usaste Wrath of the Immaterium y quieres DEVASTATING WOUNDS otra vez en tu mejor bloque.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Desecration of Worlds",cp:1,type:"Epic Deed",
   when:`Tu Command phase.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército en rango de un marcador de objetivo que controlas.`,
   eff:`Ese marcador de objetivo permanece bajo tu control hasta que el Level of Control de tu oponente sobre él sea mayor que el tuyo al final de una fase.`,
   easy:`Puntuación pura: aseguras el objetivo y puedes irte de él. De las mejores formas de gastar 1 CP.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Arcane Focus",cp:1,type:"Epic Deed",
   when:`Tu Shooting phase, justo después de hacer un Psychic test con un modelo THOUSAND SONS que haya hecho Channel the Warp (antes de resolver el Ritual).`,
   tgt:`Ese modelo THOUSAND SONS.`,
   eff:`Repite todos los D6 de ese Psychic test (incluido el D6 adicional de Channel the Warp).`,
   easy:`El botón de rescate para Twist of Fate. Ojo: repites TODO, incluido el riesgo de sacar dobles.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Devastating Sorcery",cp:2,type:"Battle Tactic",
   when:`Tu Shooting phase.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército que no haya sido seleccionada para disparar esta fase.`,
   eff:`Hasta el final de la fase, añade 9" al alcance de las armas Psychic de los modelos de tu unidad y, cada vez que un modelo de tu unidad ataque con un arma Psychic, puedes repetir la tirada de impactar y la de herir.`,
   easy:`2 CP: es tu pico ofensivo. Combínalo con Magnus o con un bloque grande de Rubrics, nunca con una unidad pequeña.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")}]},

"Rubricae Phalanx":{dp:3,disp:["Take and Hold"],
 fit:`El destacamento que más directamente potencia Rubric Marines y Scarab Occult Terminators. Si tu lista gira alrededor de bloques de RUBRICAE, este es el que más rinde.`,
 rule:{n:"All is Dust",t:`Cada vez que un ataque con una característica de Daño no modificada de 1 sea asignado a un modelo RUBRICAE de tu ejército, suma 1 a cualquier salvación por armadura hecha contra ese ataque.`,
  applies:u=>kw(u,"RUBRICAE")},
 enh:[
  {n:"Risen Rubricae",p:30,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Al inicio del paso Declare Battle Formations, selecciona dos unidades RUBRICAE BATTLELINE de tu ejército o bien otra unidad RUBRICAE de tu ejército; los modelos de las unidades seleccionadas obtienen INFILTRATORS.`},
  {n:"Lord of the Rubricae",p:15,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Mientras el portador lidere una unidad, cada vez que un modelo RUBRICAE de esa unidad haga un ataque, suma 1 a la tirada de impactar.`},
  {n:"The Stave Abominus",p:20,rq:"Solo modelo THOUSAND SONS INFANTRY",req:TSCI,
   t:`Las armas de combate cuerpo a cuerpo del portador obtienen SUSTAINED HITS D3 y DEVASTATING WOUNDS.`},
  {n:"Arcane Thralls (Aura)",p:5,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Mientras una unidad RUBRICAE amiga esté a 9" o menos del portador, puedes repetir las pruebas de Battle-shock hechas por esa unidad.<br><br><b>¿Y eso qué gana?</b> Una prueba de Battle-shock son 2D6 contra el Liderazgo (Ld) de la unidad. Los Rubric Marines tienen Ld 6+, así que la superan el 72% de las veces; repetirla sube a ~92%. <b>Fallarla es caro:</b> la unidad pasa a tener OC 0 (deja de controlar el objetivo en el que está, aunque siga viva encima de él) y no puede usar Stratagems. Por 5 pts es un seguro contra perder un objetivo que ya habías ganado.`}],
 strats:[
  {n:"Ardent Automata",cp:1,type:"Strategic Ploy",
   when:`Tu Movement phase, justo después de que una unidad RUBRICAE de tu ejército haga Fall Back.`,
   tgt:`Esa unidad RUBRICAE.`,
   eff:`Hasta el final del turno, tu unidad puede disparar y declarar carga en un turno en el que haya hecho Fall Back.`,
   easy:`Te desatasca de un combate malo sin perder la fase de disparo. Muy buena contra unidades que te traban para anularte.`,
   can:u=>kw(u,"RUBRICAE")},
  {n:"Inexorable Advance",cp:1,type:"Strategic Ploy",
   when:`Tu Movement phase.`,
   tgt:`Una unidad RUBRICAE de tu ejército.`,
   eff:`Hasta el final del turno, tu unidad puede ignorar cualquier modificador a su característica de Movimiento y a sus tiradas de Advance, y las armas a distancia de sus modelos obtienen ASSAULT.`,
   easy:`Avanzas y sigues disparando. Convierte a los Rubrics lentos en una unidad que puede reposicionarse sin perder daño.`,
   can:u=>kw(u,"RUBRICAE")},
  {n:"Infernal Fusillade",cp:2,type:"Wargear",
   when:`Tu Shooting phase.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército que no haya sido seleccionada para disparar esta fase.`,
   eff:`Hasta el final de la fase, todos los inferno bolt pistol, inferno boltgun, inferno combi-bolter e inferno combi-weapon de los modelos de tu unidad obtienen PSYCHIC y una característica de Fuerza de 5.`,
   easy:`Sube S4 a S5 (hiere a T5 con 4+ en vez de 5+) y convierte los boltguns en armas Psychic, así se benefician de Kindred Sorcery y de los buffs de facción. Úsalo con 10 Rubrics con boltguns, no con una unidad de warpflamers.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Implacable Guardians",cp:2,type:"Strategic Ploy",
   when:`La Shooting phase de tu oponente, justo después de que una unidad enemiga haya seleccionado sus objetivos.`,
   tgt:`Una unidad RUBRIC MARINES PSYKER de tu ejército seleccionada como objetivo de uno o más ataques.`,
   eff:`Hasta el final de la fase, cada vez que se asigne un ataque a un modelo de tu unidad (excluyendo modelos PSYKER), resta 1 a la característica de Daño de ese ataque.`,
   easy:`Convierte el daño 2 en daño 1 contra tus Rubrics de 2 heridas: efectivamente duplica su resistencia frente a bólters pesados y armas D2.`,
   can:u=>kw(u,"RUBRIC MARINES")},
  {n:"Revenge of the Rubricae",cp:1,type:"Strategic Ploy",
   when:`La Shooting phase de tu oponente, justo después de que un modelo THOUSAND SONS PSYKER de tu ejército sea destruido.`,
   tgt:`Una unidad RUBRICAE de tu ejército que estuviera a 6" o menos de ese modelo PSYKER al ser destruido.`,
   eff:`Después de que la unidad atacante haya disparado, tu unidad RUBRICAE puede disparar como si fuera tu Shooting phase, pero solo puede tener como objetivo a la unidad enemiga que acaba de destruir a tu modelo PSYKER (y solo si es un objetivo elegible).`,
   easy:`Una fase de disparo extra gratis. Coloca tus personajes a menos de 6" de un bloque de Rubrics para tener siempre esta amenaza disponible.`,
   can:u=>kw(u,"RUBRICAE")},
  {n:"Unwavering Phalanx",cp:1,type:"Battle Tactic",
   when:`La Charge phase de tu oponente, justo después de que una unidad enemiga termine un movimiento de carga.`,
   tgt:`Una unidad RUBRIC MARINES de tu ejército en Engagement Range de esa unidad enemiga.`,
   eff:`Hasta el final del turno, cada vez que un ataque tenga como objetivo tu unidad, resta 1 a la tirada de herir.`,
   easy:`-1 a herir contra todo lo que te haya cargado. Es tu respuesta a una unidad de asalto pesada.`,
   can:u=>kw(u,"RUBRIC MARINES")}]},

"Hexwarp Thrallband":{dp:3,disp:["Take and Hold"],
 fit:`Destacamento de control del tablero: cuanto más terreno dominas, más fuerte pega tu magia. Premia jugar agresivo hacia los objetivos centrales.`,
 rule:{n:"Flow of Magic",t:`Ciertas zonas están dentro del Flow of Magic de tu ejército:
• Tu zona de despliegue siempre está dentro del Flow of Magic.
• Al inicio de cualquier fase, si controlas al menos la mitad de los marcadores de objetivo de Tierra de Nadie, esa zona pasa a formar parte de tu Flow of Magic hasta el final de la fase.
• Al inicio de cualquier fase, si controlas al menos la mitad de los marcadores de objetivo de la zona de despliegue de tu oponente, esa zona pasa a formar parte de tu Flow of Magic hasta el final de la fase.
Cada vez que un modelo THOUSAND SONS haga un Ataque Psíquico, repite una tirada de herir de 1. Si está completamente dentro del Flow of Magic, suma 1 a la tirada de herir en su lugar.`,
  applies:u=>kw(u,"THOUSAND SONS")},
 enh:[
  {n:"Arcane Might",p:20,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Suma 1 a la Fuerza de las armas Psychic de los modelos de la unidad del portador. Mientras la unidad esté completamente dentro del Flow of Magic, suma 2 en su lugar.`},
  {n:"Empowered Manifestation",p:20,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Mientras el portador esté completamente dentro del Flow of Magic: añade 6" al alcance de sus habilidades Psychic, incluidos los Rituales, y puedes repetir las pruebas de HAZARDOUS de sus armas Psychic.`},
  {n:"Empyric Onslaught",p:25,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Mientras el portador esté completamente dentro del Flow of Magic, suma 3 a la característica de Ataques de las armas Psychic a distancia del portador.`},
  {n:"Noctilith Mantle",p:15,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Mientras la unidad del portador esté en el campo de batalla, se considera completamente dentro del Flow of Magic. Los modelos de esa unidad no pueden ser seleccionados para usar Rituales.`}],
 strats:[
  {n:"Warding Hex",cp:1,type:"Epic Deed",
   when:`Tu Command phase.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército en rango de un marcador de objetivo que controlas y completamente dentro del Flow of Magic.`,
   eff:`Ese marcador de objetivo permanece bajo tu control hasta que el Level of Control de tu oponente sobre él sea mayor que el tuyo al final de una fase.`,
   easy:`Asegura un objetivo y libera a la unidad para irse a otra parte. Puntuación barata.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Through the Veil",cp:1,type:"Epic Deed",
   when:`Paso de Reinforcements de tu Movement phase.`,
   tgt:`Una unidad RUBRIC MARINES o SCARAB OCCULT TERMINATORS de tu ejército en Strategic Reserves.`,
   eff:`La unidad RUBRIC MARINES obtiene DEEP STRIKE. La unidad SCARAB OCCULT TERMINATORS puede desplegarse completamente dentro del Flow of Magic y a más de 6" de unidades enemigas; si lo hace, no puede declarar carga ese turno.`,
   easy:`Herramienta de despliegue y puntuación. Planifica la zona de entrada ANTES de llegar a Movement.`,
   restr:`Solo una vez por fase.`,
   can:u=>named(u,"RUBRIC MARINES","SCARAB OCCULT")},
  {n:"Strands of Time",cp:1,type:"Strategic Ploy",
   when:`Tu Movement phase, después de que una unidad THOUSAND SONS PSYKER haga Fall Back.`,
   tgt:`Esa unidad PSYKER.`,
   eff:`La unidad puede disparar o declarar carga tras hacer Fall Back. Si está completamente dentro del Flow of Magic, puede disparar Y declarar carga.`,
   easy:`Convierte una retirada forzada en una fase ofensiva completa.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Scouring Warpflame",cp:1,type:"Strategic Ploy",
   when:`Tu Shooting phase.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército que no haya disparado aún, completamente dentro del Flow of Magic.`,
   eff:`Las armas a distancia de la unidad obtienen IGNORES COVER. Después de disparar, selecciona una unidad enemiga impactada: no puede tener el beneficio de cobertura hasta el final de la fase.`,
   easy:`Excelente contra ejércitos que se esconden en ruinas. El segundo efecto ayuda a tus OTRAS unidades que disparen después.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Kaleidoscopic Tempest",cp:1,type:"Battle Tactic",
   when:`La Shooting phase de tu oponente, después de que el enemigo seleccione objetivos.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército seleccionada como objetivo.`,
   eff:`La unidad obtiene STEALTH. Si está completamente dentro del Flow of Magic, además obtiene -3 al detection range.`,
   easy:`Defensa reactiva: -1 a impactar contra todos esos disparos. Úsala cuando el rival concentre una fase de fuego peligrosa.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Wrath of the Doomed",cp:1,type:"Strategic Ploy",
   when:`La Fight phase, después de que el enemigo seleccione objetivos.`,
   tgt:`Una unidad THOUSAND SONS de tu ejército seleccionada como objetivo.`,
   eff:`Los modelos destruidos que aún no hayan luchado tiran D6 (+1 si están completamente dentro del Flow of Magic): con 4+ no se retiran todavía; luchan y después se retiran.`,
   easy:`Devuelve daño desde la tumba. Vale mucho más en una unidad grande que en una pequeña.`,
   can:u=>kw(u,"THOUSAND SONS")}]},

"Ritual of Regeneration":{dp:1,disp:["Take and Hold"],
 fit:`Construido alrededor de mantener vivos a tus Psykers: cada Ritual manifestado cura. Funciona mejor con personajes de muchas heridas y con Rubrics/Scarabs liderados.`,
 rule:{n:"Sorcerous Invigoration",t:`(Una vez por turno, por unidad) Cuando una unidad amiga THOUSAND SONS PSYKER (excluyendo unidades MONSTER) manifieste con éxito un Ritual, esa unidad cura D3 heridas.`,
  applies:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")&&!kw(u,"MONSTER")},
 enh:[
  {n:"Eruption of Vitality",p:35,rq:"Solo modelo THOUSAND SONS PSYKER de INFANTRY o MOUNTED",req:u=>TSC(u)&&kw(u,"PSYKER")&&(kw(u,"INFANTRY")||kw(u,"MOUNTED")),
   t:`(Una vez por batalla, por ejército) Cuando este modelo sea destruido, al final de la fase tira 1D6: con 2+, colócalo en el campo de batalla, no trabado y tan cerca como sea posible de donde fue destruido. Este modelo no forma parte de una Attached unit y su unidad tiene una Starting Strength de 1. Le quedan 3 heridas.`},
  {n:"Curse of Life",p:20,rq:"Solo modelo THOUSAND SONS PSYKER de INFANTRY o MOUNTED",req:u=>TSC(u)&&kw(u,"PSYKER")&&(kw(u,"INFANTRY")||kw(u,"MOUNTED")),
   t:`Cuando este modelo cure como resultado de la regla de destacamento Sorcerous Invigoration, puedes añadir 3 al número de heridas curadas.`}],
 strats:[
  {n:"Relentless Rebirth",cp:1,type:"Strategic Ploy",
   when:`Cualquier fase, cuando una unidad amiga THOUSAND SONS PSYKER de INFANTRY o MOUNTED sufra una herida mortal.`,
   tgt:`Esa unidad.`,
   eff:`Tu unidad obtiene FEEL NO PAIN 5+ contra heridas mortales.`,
   easy:`Tu seguro contra ejércitos que hacen mucho daño mortal (Grey Knights, otros psíquicos, Deathwatch).`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")&&(kw(u,"INFANTRY")||kw(u,"MOUNTED"))},
  {n:"Multitudinous Limbs",cp:1,type:"Strategic Ploy",
   when:`Tu Movement phase, cuando una unidad amiga THOUSAND SONS PSYKER de INFANTRY o MOUNTED sea seleccionada para hacer un movimiento de Advance o Fall Back.`,
   tgt:`Esa unidad.`,
   eff:`Ese movimiento no impide que tu unidad sea elegible para empezar una acción.`,
   easy:`Avanzas y aun así haces la acción de la misión. Puntuación pura.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")&&(kw(u,"INFANTRY")||kw(u,"MOUNTED"))},
  {n:"Mutagenic Magicks",cp:1,type:"Strategic Ploy",
   when:`Inicio de la Fight phase.`,
   tgt:`Una unidad amiga THOUSAND SONS PSYKER trabada en combate.`,
   eff:`Selecciona una unidad enemiga trabada con tu unidad. Tira seis D6: por cada 4+, esa unidad enemiga sufre 1 herida mortal.`,
   easy:`Una media de 3 heridas mortales antes de pegar. Calcula si eso cambia cuántos modelos enemigos devolverán el golpe.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")}]},

"Warpforged Cabal":{dp:2,disp:["Priority Assets"],
 fit:`El destacamento de vehículos. Casi todas sus reglas exigen tener un PSYKER a 6" del vehículo, así que necesitas listas donde tanques y hechiceros se muevan juntos.`,
 rule:{n:"Warpfire Infusion",t:`Cada vez que una unidad THOUSAND SONS VEHICLE de tu ejército sea seleccionada para disparar o luchar, aplica uno de los siguientes efectos al resolver esos ataques: si esa unidad VEHICLE está a 6" o menos de uno o más modelos THOUSAND SONS PSYKER amigos, puedes repetir una tirada de impactar, una de herir y una de daño. En caso contrario, puedes repetir una tirada de impactar, de herir O de daño.
Además, cada vez que un modelo THOUSAND SONS VEHICLE de tu ejército con DEADLY DEMISE sea destruido estando a 6" o menos de uno o más modelos THOUSAND SONS PSYKER amigos, su DEADLY DEMISE inflige heridas mortales con un 5+ en lugar de solo con un 6.`,
  applies:u=>kw(u,"VEHICLE")&&kw(u,"THOUSAND SONS")},
 enh:[
  {n:"The Perplexing Cloak",p:20,rq:"Solo modelo THOUSAND SONS INFANTRY",req:TSCI,
   t:`Mientras el portador esté a 3" o menos de una o más unidades THOUSAND SONS VEHICLE amigas, el portador obtiene LONE OPERATIVE.`},
  {n:"Biomechanical Mutation",p:15,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`En tu Command phase puedes seleccionar un modelo THOUSAND SONS VEHICLE amigo a 6" o menos de este modelo. Ese modelo recupera hasta D3 heridas perdidas.`},
  {n:"Warp-cursed Runemaster",p:10,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Mientras el portador esté a 6" o menos de una o más unidades THOUSAND SONS VEHICLE amigas, cada vez que manifieste un Ritual, mientras lo resuelves, añade 6" a su alcance.`},
  {n:"Warp Syphon",p:5,rq:"Solo modelo THOUSAND SONS",req:TSC,
   t:`Mientras el portador esté a 6" o menos de una o más unidades THOUSAND SONS VEHICLE amigas, cada vez que haga Channel the Warp, tras tirar ese D6 adicional pero antes de comprobar dobles o triples, puede usar esta mejora: selecciona una de esas unidades VEHICLE; sufre 1 herida mortal y puedes repetir ese D6 adicional.`}],
 strats:[
  {n:"Hex-marked Armour",cp:1,type:"Battle Tactic",
   when:`La Shooting phase de tu oponente o la Fight phase, justo después de que una unidad enemiga haya seleccionado sus objetivos.`,
   tgt:`Una unidad THOUSAND SONS VEHICLE de tu ejército seleccionada como objetivo.`,
   eff:`Hasta que la unidad atacante termine sus ataques, cada vez que un ataque tenga como objetivo tu unidad, empeora en 1 el AP de ese ataque.`,
   easy:`Un lascannon AP-3 pasa a AP-2 contra tu tanque. Barato y muy eficiente.`,
   can:u=>kw(u,"VEHICLE")&&kw(u,"THOUSAND SONS")},
  {n:"Mutate Landscape",cp:1,type:"Epic Deed",
   when:`Tu Command phase.`,
   tgt:`Una unidad THOUSAND SONS PSYKER de tu ejército en rango de un marcador de objetivo que controlas.`,
   eff:`Ese objetivo queda mutado y permanece bajo tu control hasta que el Level of Control de tu oponente sea mayor al final de una fase. Mientras un objetivo esté mutado y bajo tu control, cada vez que una unidad enemiga termine un movimiento Normal, Advance, Fall Back o de carga en rango de ese objetivo, tira 1D6: con 4+ sufre D3 heridas mortales.`,
   easy:`Asegura el objetivo Y castiga a quien intente disputártelo. Excelente valor por 1 CP.`,
   can:u=>kw(u,"THOUSAND SONS")&&kw(u,"PSYKER")},
  {n:"Cyberspirit Machinations",cp:1,type:"Strategic Ploy",
   when:`Tu Movement phase, justo después de que una unidad THOUSAND SONS VEHICLE haga Fall Back.`,

function migrate(a){
 return (a||[]).map(x=>{
  if(!x||!x.u)return null;
  if(!DS[x.u]){ // nombres de 10ª que ya no existen en 11ª
   if(/Fatecaster|Greatbow/i.test(x.u))x.u="Tzaangor Enlightened with Fatecaster Greatbows";
   else if(/^Tzaangors?$/i.test(x.u))x.u="Tzaangors";
   else return null;
  }
  const d=DS[x.u];
  const out={u:x.u,size:x.size||d.sizes[0].m,sel:{},enh:"",join:x.join||""};
  if(!d.sizes.some(s=>s.m===out.size))out.size=d.sizes[0].m;
  if(x.sel&&typeof x.sel==="object")out.sel=Object.assign({},x.sel);
  if(x.enh)out.enh=x.enh;
  else if(x.w&&x.w.Enhancement)out.enh=x.w.Enhancement;
  return out;
 }).filter(Boolean);
}

/* =========================================================================
   6. MOTOR: tamaño, opciones de armamento, loadout y puntos
   ========================================================================= */
function sizeOf(x){return x.size||ds(x.u).sizes[0].m}

/* Máximo permitido de una opción, dado el tamaño y el resto de selecciones */
function optMax(x,o){
 const d=ds(x.u),n=sizeOf(x);
 let m=typeof o.max==="function"?o.max(n,x.sel||{},x):(o.max||1);
 // exclusividad: si otra opción del mismo grupo ya está tomada, esta queda a 0
 if(o.ex){
  const other=(d.opts||[]).some(z=>z.id!==o.id&&z.ex===o.ex&&(x.sel[z.id]||0)>0);
  if(other)m=0;
 }
 return Math.max(0,m);
}

/* Corrige selecciones que se hayan quedado por encima del máximo (p.ej. al bajar de 10 a 5 modelos) */
function clampSel(x){
 const d=ds(x.u);let changed=false;
 (d.opts||[]).forEach(o=>{
  const cur=x.sel[o.id]||0;if(!cur)return;
  const m=optMax(x,o);
  if(cur>m){x.sel[o.id]=m;changed=true;if(!m)delete x.sel[o.id]}
 });
 return changed;
}

/* Loadout real: base según tamaño, aplicando las opciones elegidas */
function loadout(x){
 const d=ds(x.u),n=sizeOf(x);
 const L=Object.assign({},d.base?d.base(n):{});
 (d.opts||[]).forEach(o=>{
  const c=x.sel[o.id]||0;if(!c)return;
  if(o.rem)for(const k in o.rem)L[k]=(L[k]||0)-o.rem[k]*c;
  if(o.add)for(const k in o.add)L[k]=(L[k]||0)+o.add[k]*c;
 });
 for(const k in L)if(L[k]<=0)delete L[k];
 return L;
}

function wargearPts(x){
 const d=ds(x.u);let p=0;
 (d.opts||[]).forEach(o=>{if(o.pts)p+=o.pts*(x.sel[o.id]||0)});
 return p;
}

/* Cuántas unidades del mismo datasheet hay antes de esta (para los tramos de puntos del MFM) */
function ordinalOf(i){
 let c=0;for(let j=0;j<=i;j++)if(army[j]&&army[j].u===army[i].u)c++;
 return c;
}
function sizeEntry(x){
 const d=ds(x.u);
 return d.sizes.find(s=>s.m===sizeOf(x))||d.sizes[0];
}
function basePts(x,i){
 const d=ds(x.u),se=sizeEntry(x);
 const ord=ordinalOf(i),tier=d.tier||99;
 return (ord>tier&&se.p2)?se.p2:se.p;
}
function enhPts(x){
 if(!x.enh)return 0;
 const e=(DET[detName].enh||[]).find(z=>z.n===x.enh);
 return e?e.p:0;
}
function unitCost(x,i){return basePts(x,i)+wargearPts(x)+enhPts(x)}
function total(){return army.reduce((s,x,i)=>s+unitCost(x,i),0)}

/* ---- Enhancements: legalidad, unicidad y encaje en el límite de puntos ---- */
function enhStatus(x,i){
 const d=ds(x.u),det=DET[detName],out=[];
 const isEpic=kw(d,"EPIC HERO"),isChar=kw(d,"CHARACTER");
 const cur=enhPts(x),t=total(),L=lim();
 (det.enh||[]).forEach(e=>{
  const legal=isChar&&!isEpic&&!!(e.req&&e.req(d));
  const takenBy=army.findIndex((y,j)=>j!==i&&y.enh===e.n);
  const delta=e.p-cur;
  out.push({e:e,legal:legal,taken:takenBy>=0,takenBy:takenBy,
            fits:(t+delta)<=L,over:(t+delta)-L,delta:delta});
 });
 return out;
}
/* Mejoras que SÍ puedo sugerir: legales, libres y que caben en el límite */
function suggestableEnh(){
 const out=[];
 army.forEach((x,i)=>{
  if(x.enh)return;
  enhStatus(x,i).forEach(s=>{if(s.legal&&!s.taken&&s.fits)out.push({i:i,unit:x.u,e:s.e})});
 });
 return out;
}

/* =========================================================================
   7. MOTOR DE DAÑO — para que el armamento elegido se refleje en los números
   ========================================================================= */
function avgDice(v){
 v=String(v).trim();
 if(/^\d+$/.test(v))return +v;
 const m=v.match(/^(\d*)D(\d+)(?:\s*\+\s*(\d+))?$/i);
 if(m){const n=m[1]?+m[1]:1,f=+m[2],add=m[3]?+m[3]:0;return n*(f+1)/2+add}
 return 0;
}
const NUM=s=>{const m=String(s).match(/(\d+)/);return m?+m[1]:0};
function woundNeed(s,t){
 if(s>=2*t)return 2;
 if(s>t)return 3;
 if(s===t)return 4;
 if(s*2<=t)return 6;
 return 5;
}
const pOf=n=>Math.min(1,Math.max(0,(7-n)/6));

/* ---- Unidad adjunta: qué personajes están pegados a esta unidad ---- */
function labelOf(i){return army[i].u+" #"+army.slice(0,i+1).filter(y=>y.u===army[i].u).length}
function leadersOf(i){
 const lbl=labelOf(i);
 return army.map((y,j)=>({y:y,j:j})).filter(z=>z.y.join===lbl);
}
/* Todas las armas que dispara/pega la unidad adjunta, con su dueño */
function attackPool(i){
 const pool=[];
 const push=(idx)=>{
  const x=army[idx],d=ds(x.u),L=loadout(x);
  (d.ranged||[]).forEach(w=>{if(L[w.n])pool.push({w:w,count:L[w.n],owner:idx,melee:false})});
  (d.melee||[]).forEach(w=>{if(L[w.n])pool.push({w:w,count:L[w.n],owner:idx,melee:true})});
 };
 push(i);
 leadersOf(i).forEach(z=>push(z.j));
 return pool;
}

/* ---- Contexto de buffs para una unidad de la lista ---- */
function ctxOf(i){
 const x=army[i],d=ds(x.u),L=leadersOf(i);
 return {i:i,x:x,d:d,leaders:L,
  lds:L.map(z=>ds(z.y.u)),
  enhs:[x.enh].concat(L.map(z=>z.y.enh)).filter(Boolean),
  enhOwner:n=>{if(x.enh===n)return i;const z=L.find(q=>q.y.enh===n);return z?z.j:-1},
  hasLeader:n=>L.some(z=>z.y.u===n)||x.u===n,
  det:detName};
}

function availableBuffs(c){return BUFFS.filter(b=>{try{return b.av(c)}catch(e){return false}})}

/* Keywords efectivas del arma tras los buffs que CONCEDEN palabras clave */
function effKeywords(p,c,active){
 let K=(p.w.k||[]).map(z=>z.toUpperCase());
 active.forEach(b=>{
  if(!b.sc(p.w,c,p.owner,p.melee,K))return;
  const probe={sustained:0,hit:0,wound:0,ap:0,s:0,d:0,a:0};
  b.ap(probe,p.melee);
  if(probe.psychic&&K.indexOf("PSYCHIC")<0)K=K.concat(["PSYCHIC"]);
 });
 return K;
}

function newMods(){return {hit:0,wound:0,ap:0,s:0,d:0,a:0,sSet:0,sustained:0,
 lethal:false,dev:false,ic:false,psychic:false,rrH1:false,rrH:false,rrW1:false,rrW:false}}

function modsFor(p,c,active,K){
 const m=newMods();
 active.forEach(b=>{if(b.sc(p.w,c,p.owner,p.melee,K))b.ap(m,p.melee)});
 return m;
}

/* Daño esperado de una entrada de arma, con modificadores ya calculados */
function expected(w,count,tg,m,K){
 if(!count)return 0;
 m=m||newMods();
 K=K||(w.k||[]).map(z=>z.toUpperCase());
 const hasK=p=>K.some(z=>z.indexOf(p)===0);
 const kVal=p=>{const z=K.find(y=>y.indexOf(p)===0);return z?NUM(z):0};

 let a=(avgDice(w.a)+m.a)*count;
 if(tg.half&&hasK("RAPID FIRE"))a+=kVal("RAPID FIRE")*count;

 const skill=w.bs!==undefined?w.bs:w.ws;
 const torrent=hasK("TORRENT")||skill==="—"||skill==="N/A";
 let pHit=1,critH=0;
 if(!torrent){
  const need=Math.max(2,NUM(skill)-m.hit);
  pHit=pOf(need);
  critH=1/6;
  if(m.rrH){critH+=(1-pHit)*(1/6);pHit=pHit+(1-pHit)*pHit}
  else if(m.rrH1){critH+=(1/6)*(1/6);pHit=pHit+(1/6)*pHit}
 }

 let hits=a*pHit;
 let sus=m.sustained;
 if(hasK("SUSTAINED HITS")){
  const v=String(K.find(z=>z.indexOf("SUSTAINED HITS")===0)).replace("SUSTAINED HITS","").trim();
  sus+=(/^D/i.test(v)?avgDice(v):(+v||0));
 }
 if(sus)hits+=a*critH*sus;
 const critHits=a*critH;
 let autoW=0,rollHits=hits;
 if(hasK("LETHAL HITS")||m.lethal){autoW=critHits;rollHits=Math.max(0,hits-critHits)}

 let s=m.sSet?m.sSet:NUM(w.s);
 s+=m.s;
 let need=Math.max(2,woundNeed(s,tg.t)-m.wound);
 let critNeed=6;
 const anti=K.find(z=>z.indexOf("ANTI-")===0);
 if(anti){
  const type=anti.replace("ANTI-","").replace(/\s*\d\+$/,"").trim();
  if(tg.kw.indexOf(type)>=0){const y=NUM(anti);critNeed=Math.min(critNeed,y);need=Math.min(need,y)}
 }
 let pW=pOf(need);
 if(hasK("TWIN-LINKED")||m.rrW)pW=pW+(1-pW)*pW;
 else if(m.rrW1)pW=pW+(1/6)*pW;
 const pCritW=pOf(critNeed);

 let wounds=rollHits*pW+autoW;
 let critW=rollHits*pCritW+((hasK("LETHAL HITS")||m.lethal)?autoW*(1/6):0);
 if(critW>wounds)critW=wounds;

 let dmg=avgDice(w.d)+m.d;
 if(tg.half&&hasK("MELTA"))dmg+=kVal("MELTA");
 if(dmg<1)dmg=1;

 const ap=Math.abs(NUM(w.ap)||0)+m.ap;
 let armour=tg.sv+ap;
 if(tg.cover&&!hasK("IGNORES COVER")&&!m.ic)armour-=1;
 let need2=armour;
 if(tg.inv)need2=Math.min(need2,tg.inv);
 const pSave=Math.min(5/6,pOf(need2));

 if(hasK("DEVASTATING WOUNDS")||m.dev){
  const normal=Math.max(0,wounds-critW);
  return normal*(1-pSave)*dmg + critW*dmg;
 }
 return wounds*(1-pSave)*dmg;
}

/* Simulación completa de la unidad adjunta i con los buffs activos */
function simulate(i){
 const c=ctxOf(i);
 const active=availableBuffs(c).filter(b=>simBuffs[b.id]);
 const pool=attackPool(i);
 const rows=[],warn=[];
 const groups={};
 pool.forEach(p=>{
  const K=effKeywords(p,c,active);
  const m=modsFor(p,c,active,K);
  const v=expected(p.w,p.count,target,m,K);
  const g=(p.melee?"M:":"R:")+p.w.n.split("–")[0].trim()+"#"+p.owner;
  const row={n:p.w.n,count:p.count,v:v,melee:p.melee,owner:p.owner,K:K,m:m,w:p.w};
  if(!groups[g]||v>groups[g].v)groups[g]=row;   // Strike/Sweep: solo cuenta el mejor
  rows.push(row);
  /* avisos de anti-sinergia */
  const torrent=K.indexOf("TORRENT")>=0;
  if(torrent&&m.sustained)warn.push(`<b>${p.w.n}</b> tiene TORRENT: impacta automáticamente, no hay tirada de impactar y por tanto <b>no puede generar 6 críticos</b>. SUSTAINED HITS no le hace absolutamente nada.`);
  if(torrent&&m.lethal)warn.push(`<b>${p.w.n}</b> tiene TORRENT: LETHAL HITS no le aporta nada, porque nunca hay impactos críticos.`);
  if(torrent&&m.hit)warn.push(`<b>${p.w.n}</b> tiene TORRENT: el +1 a impactar se desperdicia, ya impacta siempre.`);
  if(m.ic&&K.indexOf("IGNORES COVER")>=0)warn.push(`<b>${p.w.n}</b> ya tenía IGNORES COVER: el buff que se lo concede es redundante en esta arma.`);
  if(m.dev&&(p.w.k||[]).indexOf("DEVASTATING WOUNDS")>=0)warn.push(`<b>${p.w.n}</b> ya tenía DEVASTATING WOUNDS de serie: no se acumula.`);
 });
 if(simBuffs.fusillade&&!pool.some(p=>INFERNO.test(p.w.n)))
  warn.push(`Has activado <b>Infernal Fusillade</b> (2 CP) pero esta unidad no lleva ningún arma inferno: no hace nada. Con warpflamers no sirve; sirve con inferno boltguns.`);
 const totR=Object.keys(groups).filter(g=>g[0]==="R").reduce((s,g)=>s+groups[g].v,0);
 const totM=Object.keys(groups).filter(g=>g[0]==="M").reduce((s,g)=>s+groups[g].v,0);
 return {c:c,active:active,rows:rows,best:groups,ranged:totR,melee:totM,
         warn:warn.filter((v,k,arr)=>arr.indexOf(v)===k)};
}

function unitDamageNet(x,i){
 const s=simulate(i);
 return {ranged:s.ranged,melee:s.melee};
}
function unitWounds(x){
 const d=ds(x.u),n=sizeOf(x);
 if(d.profiles.length===1)return NUM(d.profiles[0].st[3])*n;
 const lead=NUM(d.profiles[0].st[3]),rest=NUM(d.profiles[1].st[3]);
 return lead+rest*(n-1);
}

/* =========================================================================
   8. VALIDACIÓN Y KPIs
   ========================================================================= */
function problems(){
 const P=[],t=total(),L=lim(),det=DET[detName];
 if(t>L)P.push({s:"bad",t:`Te pasas del límite: <b>${t} pts</b> de ${L} (sobran ${t-L}).`});
 const seen={};
 army.forEach((x,i)=>{
  const d=ds(x.u);
  if(x.enh){
   const st=enhStatus(x,i).find(z=>z.e.n===x.enh);
   if(!st)P.push({s:"bad",t:`<b>${x.u} #${i+1}</b>: la mejora «${x.enh}» no pertenece a ${detName}. Cámbiala en el editor.`});
   else{
    if(!st.legal)P.push({s:"bad",t:`<b>${x.u} #${i+1}</b>: «${x.enh}» no es legal para este modelo (${st.e.rq}).`});
    if(st.taken)P.push({s:"bad",t:`<b>${x.u} #${i+1}</b>: «${x.enh}» ya está asignada a otra unidad. Cada Enhancement solo puede usarse una vez por ejército.`});
   }
  }
  if(kw(d,"EPIC HERO")){
   if(seen[x.u])P.push({s:"bad",t:`<b>${x.u}</b> es un EPIC HERO: solo puedes incluir uno por ejército.`});
   seen[x.u]=1;
  }
  (d.opts||[]).forEach(o=>{
   const c=x.sel[o.id]||0,m=optMax(x,o);
   if(c>m)P.push({s:"bad",t:`<b>${x.u} #${i+1}</b>: has seleccionado ${c}× ${o.n} pero el máximo legal es ${m}.`});
  });
  if(kw(d,"SCINTILLATING LEGIONS")&&detName!=="Changehost of Deceit")
   P.push({s:"warn",t:`<b>${x.u}</b> es SCINTILLATING LEGIONS: solo es legal con el destacamento Changehost of Deceit.`});
  if(d.legends)P.push({s:"warn",t:`<b>${x.u}</b> es un datasheet de Warhammer Legends: acuérdalo con tu rival antes de jugarlo.`});
 });
 if(army.some(x=>x.u==="Magnus the Red")&&army.length>1)
  P.push({s:"info",t:`Magnus the Red tiene Supreme Commander: <b>debe ser tu Warlord</b>.`});
 const sug=suggestableEnh();
 if(t<=L&&sug.length){
  const seenE={},list=[];
  sug.forEach(z=>{if(!seenE[z.e.n]){seenE[z.e.n]=1;list.push(`${z.e.n} (+${z.e.p} pts, para ${z.unit})`)}});
  P.push({s:"info",t:`Mejoras que aún caben en tu límite: ${list.join(" · ")}.`});
 }
 const blocked=[];
 army.forEach((x,i)=>{if(x.enh)return;enhStatus(x,i).forEach(s=>{
  if(s.legal&&!s.taken&&!s.fits&&blocked.indexOf(s.e.n)<0)blocked.push(s.e.n)})});
 if(blocked.length)P.push({s:"info",t:`No te sugiero estas mejoras porque te pasarías de puntos: ${blocked.join(", ")}. Libera puntos si te interesan.`});
 const syn=armySynergyCount();
 if(syn.bad)P.push({s:"warn",t:`⚠ <b>${syn.bad} aviso${syn.bad>1?"s":""} de sinergia desperdiciada.</b> Mira el bloque «Sinergias detectadas» en la tarjeta de cada unidad.`});
 if(syn.good)P.push({s:"info",t:`✓ ${syn.good} sinergia${syn.good>1?"s":""} buena${syn.good>1?"s":""} detectada${syn.good>1?"s":""} en tu lista.`});
 return P;
}

  `<div class="kpi"><span>Restantes</span><b>${L-t}</b></div>`,
  `<div class="kpi"><span>DP</span><b>${d.dp}</b></div>`,
  `<div class="kpi"><span>Force Disposition</span><b style="font-size:14px">${d.disp.join(" / ")}</b></div>`,
  `<div class="kpi"><span>Unidades / modelos</span><b>${army.length} / ${army.reduce((s,x)=>s+sizeOf(x),0)}</b></div>`].join("");

}

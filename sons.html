 const KW=["INFANTRY","VEHICLE","MONSTER","FLY"];
 const avail=availableBuffs(c);
 const ldTxt=c.leaders.length
  ? c.leaders.map(z=>`<b>${z.y.u}</b>${z.y.enh?` (⚜ ${z.y.enh})`:""}`).join(" + ")
  : `<span class="muted">sin personaje adjunto</span>`;

 return `<div class="ds" id="simPanel">
 <div class="ds-head"><h3>🎯 Simulador de ataque</h3><span class="pts">daño esperado</span></div>
 <div class="ds-body">
  <div class="two">
   <div><label>¿Quién ataca?</label>
    <select onchange="setAttacker(this.value)">${army.map((x,j)=>`<option value="${j}"${j===i?" selected":""}>${sizeOf(x)}× ${x.u}</option>`).join("")}</select>
    <div class="small" style="margin-top:5px">Unidad adjunta: ${ldTxt}. ${c.leaders.length?"Se suman las armas del personaje y las de la unidad.":"Adjunta un personaje desde su tarjeta para que sus buffs aparezcan aquí."}</div>
   </div>
   <div><label>Objetivo típico</label>
    <select onchange="applyPreset(this.value)"><option value="">— elegir un preajuste —</option>${PRESETS.map((p,k)=>`<option value="${k}">${p.n} — T${p.t} Sv${p.sv}+${p.inv?" inv "+p.inv+"+":""}</option>`).join("")}</select>
   </div>
  </div>

  <div class="secbar">Objetivo</div>
  <div class="row" style="gap:12px;align-items:flex-end">
   <div style="flex:1;min-width:86px"><label>Resistencia (T)</label><input type="number" min="1" max="14" value="${target.t}" oninput="setTgt('t',this.value)"></div>
   <div style="flex:1;min-width:86px"><label>Salvación (Sv)</label><input type="number" min="2" max="7" value="${target.sv}" oninput="setTgt('sv',this.value)"></div>
   <div style="flex:1;min-width:110px"><label>Invulnerable (0=ninguna)</label><input type="number" min="0" max="6" value="${target.inv}" oninput="setTgt('inv',this.value)"></div>
   <div style="flex:2;min-width:190px"><label>Palabras clave del objetivo</label><div>${KW.map(k=>`<span class="chip${target.kw.indexOf(k)>=0?" on":""}" style="cursor:pointer" onclick="togKw('${k}')">${k}</span>`).join("")}</div></div>
  </div>
  <div class="row" style="gap:12px;margin-top:8px">
   <label class="check" style="margin:0"><input type="checkbox" ${target.cover?"checked":""} onchange="setTgt('cover',this.checked?1:0)"> <span>El objetivo está en cobertura (+1 a su salvación)</span></label>
   <label class="check" style="margin:0"><input type="checkbox" ${target.half?"checked":""} onchange="setTgt('half',this.checked?1:0)"> <span>Disparo a media distancia</span></label>
  </div>
  <div class="note"><b>¿Qué es «media distancia»?</b> Es la mitad del alcance del arma. Un inferno boltgun de 24" está a media distancia si el enemigo está a 12" o menos. Solo cambia dos cosas: <b>RAPID FIRE X</b> le suma X ataques (un inferno combi-bolter RAPID FIRE 2 pasa de 2 a 4 disparos) y <b>MELTA X</b> le suma X al Daño (un multi-melta MELTA 2 pasa de D6 a D6+2). Si el arma no tiene ninguna de las dos, marcar esta casilla no cambia nada.</div>

  <div class="secbar">Buffs activos — marca los que vayas a tener de verdad</div>
  ${avail.length?`<div id="simBuffs">${avail.map(b=>`<label class="check" style="margin:5px 0">
     <input type="checkbox" ${simBuffs[b.id]?"checked":""} onchange="togBuff('${b.id}')">
     <span><b>${b.n}</b> <span class="small">· ${b.src}</span><br><span class="small">${b.d}</span></span></label>`).join("")}</div>`
   :`<p class="small">Esta unidad no tiene ningún buff disponible con tu destacamento y tus personajes actuales.</p>`}

  <div id="simOut">${simOutput(S)}</div>
 </div></div>`;
}

function simOutput(S){
 const rows=Object.keys(S.best).map(g=>S.best[g]).sort((a,b)=>b.v-a.v);
 const line=r=>`<tr><td><span class="wcount">${r.count}×</span>${r.n}${r.owner!==simAttacker?' <span class="small">(personaje)</span>':""}
   <span class="wkw">[${r.K.join(", ")}]</span></td><td>${r.melee?"Combate":"Distancia"}</td><td><b>${r.v.toFixed(2)}</b></td></tr>`;
 return `<div class="secbar">Resultado</div>
 <div class="scroll"><table class="wep"><thead><tr><th>Arma (perfil más eficaz)</th><th>Fase</th><th>Heridas esperadas</th></tr></thead>
 <tbody>${rows.length?rows.map(line).join(""):`<tr><td colspan="3">Sin armas.</td></tr>`}</tbody></table></div>
 <div class="two" style="margin-top:10px">
  <div class="note"><b>Disparo:</b> ${S.ranged.toFixed(1)} heridas · <b>Combate:</b> ${S.melee.toFixed(1)} heridas
  <br><span class="small">Contra T${target.t} Sv${target.sv}+${target.inv?" / inv "+target.inv+"+":""}${target.cover?" en cobertura":""}. Los perfiles alternativos (Strike/Sweep, witchfire/focused) no se suman: solo cuenta el mejor de cada arma, porque en la partida eliges uno.</span></div>
  <div class="note ${S.warn.length?"bad":"ok"}"><b>${S.warn.length?"⚠ Avisos de sinergia":"✓ Sin desperdicios"}</b>
  ${S.warn.length?"<br>"+S.warn.join("<br>"):"<br><span class='small'>Ningún buff activo se está desperdiciando en estas armas.</span>"}</div>
 </div>`;
}

function setAttacker(v){simAttacker=+v;renderBuilder()}
function applyPreset(k){
 if(k==="")return;
 const p=PRESETS[+k];
 target.t=p.t;target.sv=p.sv;target.inv=p.inv;target.kw=p.kw.slice();
 saveSim();renderBuilder();
}
/* Cambios numéricos: solo se redibuja el resultado, así el foco y el scroll no se pierden */
function setTgt(k,v){
 if(k==="half")target.half=!!+v;
 else if(k==="cover")target.cover=!!+v;
 else target[k]=+v||0;
 saveSim();refreshSim();
}
function togKw(k){
 const i=target.kw.indexOf(k);
 if(i>=0)target.kw.splice(i,1);else target.kw.push(k);
 saveSim();renderBuilder();
}
function togBuff(id){simBuffs[id]=!simBuffs[id];saveSim();refreshSim();refreshCards()}
/* Reescribe solo los números, sin tocar los inputs */
function refreshSim(){
 const el=document.getElementById("simOut");
 if(el){el.innerHTML=simOutput(simulate(simAttacker));applyGlossary(el)}
 refreshCards();
}
function refreshCards(){
 army.forEach((x,i)=>{
  const el=document.querySelector('[data-dmg="'+i+'"]');
  if(!el)return;
  const d=unitDamageNet(x,i);
  el.innerHTML=`A distancia: <b>${d.ranged.toFixed(1)}</b> heridas · Combate: <b>${d.melee.toFixed(1)}</b> heridas`;
 });
}

function editCard(x,i){
 const d=ds(x.u),n=sizeOf(x),L=loadout(x),dmg=unitDamageNet(x,i);
 const sizes=d.sizes.map(s=>`<option value="${s.m}"${s.m===n?" selected":""}>${s.m} modelo${s.m>1?"s":""} — ${(ordinalOf(i)>(d.tier||99)&&s.p2)?s.p2:s.p} pts</option>`).join("");
 const unitOpts=NAMES.map((z,zi)=>`<option value="${zi}"${z===x.u?" selected":""}>${z}${DS[z].legends?" (Legends)":""}</option>`).join("");

 /* ---- contadores de armamento ---- */
 const wg=(d.opts||[]).length?(d.opts.map(o=>{
   const c=x.sel[o.id]||0,m=optMax(x,o);
   const dis=m===0&&c===0;
   return `<div class="wg"${dis?' style="opacity:.5"':""}>
    <div class="wg-top"><span class="wg-name">${o.n}${o.pts?` <span class="small">(+${o.pts} pts c/u)</span>`:""}</span>
     <span class="stepper">
      <button onclick="bumpSel(${i},'${o.id}',-1)" ${c<=0?"disabled":""}>−</button>
      <input type="number" min="0" max="${m}" value="${c}" onchange="setSel(${i},'${o.id}',this.value)">
      <button onclick="bumpSel(${i},'${o.id}',1)" ${c>=m?"disabled":""}>+</button>
      <span class="small ${c>=m&&m>0?"maxed":""}" style="width:52px;text-align:right">máx ${m}</span>
     </span></div>
    <div class="small">${o.d}</div></div>`;
  }).join("")):`<p class="small">Este datasheet no tiene opciones de armamento: su equipo es fijo.</p>`;

 /* ---- mejoras ---- */
 let enhBlock="";
 if(kw(d,"CHARACTER")&&!kw(d,"EPIC HERO")){
  const st=enhStatus(x,i).filter(z=>z.legal);
  if(!st.length){
   enhBlock=`<label>Mejora (Enhancement) de ${detName}</label><p class="small">Ninguna mejora de este destacamento es legal para ${x.u}.</p>`;
  }else{
   const opts=st.map(z=>{
    const blocked=z.taken||(!z.fits&&z.e.n!==x.enh);
    let why="";
    if(z.taken)why=" — ya asignada a "+army[z.takenBy].u;
    else if(!z.fits&&z.e.n!==x.enh)why=` — no cabe: te pasarías ${z.over} pts`;
    return `<option value="${esc(z.e.n)}"${x.enh===z.e.n?" selected":""}${blocked?" disabled":""}>${z.e.n} (+${z.e.p} pts)${why}</option>`;
   }).join("");
   const cur=st.find(z=>z.e.n===x.enh);
   enhBlock=`<label>Mejora (Enhancement) de ${detName}</label>
    <select onchange="setEnh(${i},this.value)"><option value="">Sin mejora</option>${opts}</select>
    ${cur?`<div class="note"><b>${cur.e.n}</b> · ${cur.e.p} pts · <span class="small">${cur.e.rq}</span><br>${cur.e.t}</div>`:""}
    <details><summary>Ver qué hace cada mejora legal para ${x.u}</summary>${st.map(z=>`<div class="ab"><b>${z.e.n}</b> · ${z.e.p} pts ${z.taken?'<span class="small">(ya usada)</span>':z.fits?"":'<span class="small">(no cabe en tu límite)</span>'}<br><span class="small">${z.e.rq}</span><br>${z.e.t}</div>`).join("")}</details>`;
  }
 }

 /* ---- líder ---- */
 let joinBlock="";
 if(d.leads&&d.leads.length){
  const cands=army.map((y,j)=>({y:y,j:j})).filter(z=>d.leads.indexOf(z.y.u)>=0);
  joinBlock=`<label>Unidad que lidera (Leader)</label><select onchange="setJoin(${i},this.value)">
   <option value=""${!x.join?" selected":""}>Sin adjuntar</option>
   ${cands.map(z=>{const lbl=z.y.u+" #"+(army.slice(0,z.j+1).filter(w=>w.u===z.y.u).length);return `<option value="${esc(lbl)}"${x.join===lbl?" selected":""}>${lbl}</option>`}).join("")}
  </select><div class="small">Puede liderar: ${d.leads.join(", ")}.</div>`;
 }else if(kw(d,"CHARACTER")&&!kw(d,"MONSTER")){
  joinBlock=`<div class="small" style="margin-top:8px">Este personaje no tiene la habilidad Leader en 11ª: actúa por su cuenta.</div>`;
 }

 return `<div class="ds">
 <div class="ds-head"><h3>${i+1}. ${x.u}</h3><span class="pts">${unitCost(x,i)} pts</span></div>
 <div class="ds-body">
  <div class="two">
   <div><label>Datasheet</label><select onchange="changeUnit(${i},this.value)">${unitOpts}</select></div>
   <div><label>Tamaño de unidad</label><select onchange="setSize(${i},this.value)">${sizes}</select></div>
  </div>
  <div class="small" style="margin-top:6px">${d.comp}</div>
  <div class="secbar">Opciones de armamento — elige cuántas</div>
  ${wg}
  ${enhBlock}
  ${joinBlock}
  <div class="secbar">Loadout resultante</div>
  ${loadoutTable(x)}
  <div class="two" style="margin-top:10px">
   <div class="note"><b>Perfil de la unidad</b><br>${sizeOf(x)} modelos · ${unitWounds(x)} W totales · ${unitCost(x,i)} pts
   <br><span class="small">${basePts(x,i)} pts base${wargearPts(x)?` + ${wargearPts(x)} de armamento`:""}${enhPts(x)?` + ${enhPts(x)} de mejora`:""}</span></div>
   <div class="note"><b>Daño esperado</b> (incluye los buffs marcados en el simulador)<br>
    <span data-dmg="${i}">A distancia: <b>${dmg.ranged.toFixed(1)}</b> heridas · Combate: <b>${dmg.melee.toFixed(1)}</b> heridas</span>
    <br><span class="small">Cambia los contadores de arriba y verás cómo se mueven estos números.</span></div>
  </div>
  ${synergyBlock(i)}
  <div class="row" style="margin-top:10px"><button class="danger" onclick="delUnit(${i})">Eliminar unidad</button><button onclick="dupUnit(${i})">Duplicar</button></div>
 </div></div>`;
}

function loadoutTable(x){
 const d=ds(x.u),L=loadout(x);
 const rows=t=>(d[t]||[]).filter(w=>L[w.n]).map(w=>weaponRow(w,L[w.n],t==="melee")).join("");
 const r=rows("ranged"),m=rows("melee");
 return (r?`<div class="scroll"><table class="wep"><thead><tr><th>Armas a distancia</th><th data-noglossary>RANGE</th><th><span class="gterm" data-g="A">A</span></th><th><span class="gterm" data-g="BS">BS</span></th><th><span class="gterm" data-g="S">S</span></th><th><span class="gterm" data-g="AP">AP</span></th><th><span class="gterm" data-g="D">D</span></th></tr></thead><tbody>${r}</tbody></table></div>`:"")
  +(m?`<div class="scroll" style="margin-top:8px"><table class="wep"><thead><tr><th>Armas de combate</th><th data-noglossary>RANGE</th><th><span class="gterm" data-g="A">A</span></th><th><span class="gterm" data-g="WS">WS</span></th><th><span class="gterm" data-g="S">S</span></th><th><span class="gterm" data-g="AP">AP</span></th><th><span class="gterm" data-g="D">D</span></th></tr></thead><tbody>${m}</tbody></table></div>`:"");
}
function weaponRow(w,count,isMelee){
 const skill=isMelee?w.ws:w.bs;
 return `<tr><td>${count?`<span class="wcount">${count}×</span>`:""}${w.n}${(w.k&&w.k.length)?`<span class="wkw">[${w.k.join(", ")}]</span>`:""}</td>
 <td>${w.r}</td><td>${w.a}</td><td>${skill}</td><td>${w.s}</td><td>${w.ap}</td><td>${w.d}</td></tr>`;
}

/* =========================================================================
   9b. SINERGIAS Y ANTI-SINERGIAS
   Se calculan sobre la composición real de la lista y el loadout elegido,
   así que avisan ANTES de que gastes los puntos o el CP.
   ========================================================================= */
function has(u){return army.some(x=>x.u===u)}
/* Separa las armas de la unidad adjunta entre las que tiran para impactar y las
   que impactan automáticamente: es la base de todos los avisos parciales. */
function isAutoHit(p){
 const K=p.w.k||[],sk=p.melee?p.w.ws:p.w.bs;
 return K.indexOf("TORRENT")>=0||sk==="—"||sk==="N/A";
}
function hitRollSplit(i){
 const pool=attackPool(i);
 return {rolls:pool.filter(p=>!isAutoHit(p)),auto:pool.filter(isAutoHit)};
}
function fmtPool(list){
 const agg={},order=[];
 list.forEach(p=>{if(!agg[p.w.n]){agg[p.w.n]=0;order.push(p.w.n)}agg[p.w.n]+=p.count});
 return order.map(n=>agg[n]+"× "+n).join(", ")||"nada";
}

function synergies(i){
 const x=army[i],d=ds(x.u),L=loadout(x),c=ctxOf(i),out=[];
 const rangedW=(d.ranged||[]).filter(w=>L[w.n]);
 const meleeW=(d.melee||[]).filter(w=>L[w.n]);
 const isT=w=>(w.k||[]).indexOf("TORRENT")>=0;
 const allTorrent=rangedW.length>0&&rangedW.every(isT);
 const someTorrent=rangedW.some(isT);
 const anyBolt=Object.keys(L).some(n=>INFERNO.test(n));
 const psykersInArmy=army.some(y=>kw(ds(y.u),"PSYKER"));

 /* --- buffs que dependen de la tirada de impactar: se evalúan ARMA POR ARMA --- */
 const sp=hitRollSplit(i);
 const partial=(name,what,why,alt)=>{
  if(!sp.rolls.length)
   return {s:"bad",t:`<b>${name} no te sirve en esta unidad.</b> ${why} Ninguna de sus armas tira para impactar (${fmtPool(sp.auto)}), así que el buff se pierde por completo.${alt?" "+alt:""}`};
  if(!sp.auto.length)
   return {s:"good",t:`<b>${name} se aplica a toda la unidad.</b> ${what} Afecta a: ${fmtPool(sp.rolls)}.`};
  return {s:"info",t:`<b>${name} se aplica solo a parte de la unidad.</b> ${why}<br>✓ <b>Sí funciona en:</b> ${fmtPool(sp.rolls)}.<br>✗ <b>Se desperdicia en:</b> ${fmtPool(sp.auto)} — son TORRENT: impactan automáticamente y nunca hay un 6 crítico que activar.`};
 };

 if(c.hasLeader("Infernal Master"))
  out.push(partial("Malefic Maelstrom",
   `SUSTAINED HITS 1 añade un impacto extra por cada 6 natural al impactar.`,
   `SUSTAINED HITS 1 solo se activa con un <b>6 natural en la tirada de impactar</b>.`,
   `Con esta configuración te rinde más un Exalted Sorcerer (invulnerable 4+) o un Sorcerer.`));

 if(c.hasLeader("Sorcerer")||c.hasLeader("Sorcerer in Terminator Armour"))
  out.push(partial("Empyric Guidance",
   `LETHAL HITS hace que cada 6 natural al impactar hiera automáticamente, ignorando la Resistencia.`,
   `LETHAL HITS depende de sacar un <b>6 natural al impactar</b>.`,
   ``));

 if(c.enhs.indexOf("The Stave Abominus")>=0)
  out.push({s:"good",t:`<b>The Stave Abominus</b> afecta solo a las armas de <b>combate del portador</b>, no a la unidad: SUSTAINED HITS D3 y DEVASTATING WOUNDS sobre sus ${meleeW.length?"ataques cuerpo a cuerpo":"armas de combate"}. En combate no hay armas TORRENT, así que aquí no se desperdicia nada.`});

 const hitBuff=c.hasLeader("Tzaangor Shaman")?"Bestial Prophet"
   :(c.enhs.indexOf("Lord of the Rubricae")>=0?"Lord of the Rubricae"
   :(c.hasLeader("Sorcerer in Terminator Armour")?"Marked by Fate":null));
 if(hitBuff){
  const worst=sp.rolls.filter(p=>NUM(p.melee?p.w.ws:p.w.bs)>=4);
  if(!sp.rolls.length)
   out.push({s:"bad",t:`<b>${hitBuff} (+1 a impactar) no hace nada aquí.</b> Todas las armas de la unidad son TORRENT (${fmtPool(sp.auto)}): impactan automáticamente, no hay tirada que mejorar.`});
  else if(worst.length)
   out.push({s:"good",t:`<b>${hitBuff} (+1 a impactar) rinde mucho aquí.</b> Sobre armas de 4+ el salto a 3+ es un <b>+33% de impactos</b>. Beneficia especialmente a: ${fmtPool(worst)}.${sp.auto.length?`<br><span class="small">No afecta a ${fmtPool(sp.auto)} (TORRENT).</span>`:""}`});
  else
   out.push({s:"info",t:`<b>${hitBuff} (+1 a impactar)</b> se aplica a ${fmtPool(sp.rolls)}, que ya impactan a 3+ o mejor: la mejora es real pero pequeña (de 67% a 83%). Rinde más en unidades de BS 4+.${sp.auto.length?` No afecta a ${fmtPool(sp.auto)} (TORRENT).`:""}`});
 }

 /* --- icon of flame --- */
 if(x.sel&&x.sel.icon){
  if(allTorrent)out.push({s:"bad",t:`<b>Icon of flame redundante.</b> Concede IGNORES COVER a las armas a distancia de la unidad, pero tus warpflamers <b>ya tienen IGNORES COVER de serie</b>. Con esta configuración el icono no hace nada; sirve si llevas inferno boltguns.`});
  else out.push({s:"good",t:`<b>Icon of flame + inferno boltguns.</b> Les da IGNORES COVER, que es exactamente lo que les falta: anula el +1 a salvar de la cobertura en un ejército que se esconde en ruinas.`});
 }

 /* --- invulnerable --- */
 if(c.hasLeader("Exalted Sorcerer")&&(kw(d,"RUBRICAE")))
  out.push({s:"good",t:`<b>Exalted Sorcerer + RUBRICAE.</b> Arcane Shield da invulnerable 4+ a toda la unidad. Contra armas de AP-3 o más (lascannon, garras de energía) pasas de salvar casi nada a salvar la mitad.`});

 /* --- líderes ilegales o huérfanos --- */
 if(kw(d,"SCARAB OCCULT")&&!has("Sorcerer in Terminator Armour")&&!c.leaders.length)
  out.push({s:"info",t:`<b>Scarab Occult sin líder.</b> Su único Leader legal es el <b>Sorcerer in Terminator Armour</b>. Sin él pierdes LETHAL HITS y el +1 a impactar de Marked by Fate.`});
 if(x.u==="Sorcerer in Terminator Armour"&&!has("Scarab Occult Terminators"))
  out.push({s:"bad",t:`<b>Sorcerer in Terminator Armour sin Scarab Occult.</b> Solo puede liderar Scarab Occult Terminators. Sin ellos se queda como un personaje suelto de 5 heridas, que es un uso muy pobre de 95 pts.`});

 /* --- LANCE / PRECISION --- */
 if(meleeW.some(w=>(w.k||[]).indexOf("LANCE")>=0))
  out.push({s:"info",t:`<b>Arma con LANCE.</b> +1 a herir <b>solo el turno en que cargas</b>. Si esta unidad se queda quieta, pierde su mejor característica: úsala siempre cargando.`});
 if(rangedW.concat(meleeW).some(w=>(w.k||[]).indexOf("PRECISION")>=0))
  out.push({s:"good",t:`<b>PRECISION.</b> Puedes asignar estas heridas directamente al personaje enemigo escondido dentro de una unidad. Es tu herramienta para matar al líder que da los buffs.`});

 /* --- destacamento --- */
 if(detName==="Rubricae Phalanx"&&kw(d,"RUBRICAE"))
  out.push({s:"good",t:`<b>All is Dust.</b> +1 a la salvación contra cada ataque de <b>Daño 1</b>: los inferno boltguns, bólters y metralletas enemigas pasan a herirte muchísimo menos. Estos modelos salvan a 2+ contra fuego ligero.`});
 if(detName==="Warpforged Cabal"&&kw(d,"VEHICLE")&&!psykersInArmy)
  out.push({s:"bad",t:`<b>Vehículo sin Psykers cerca.</b> Casi todo Warpforged Cabal exige un THOUSAND SONS PSYKER a 6" del vehículo. Sin psykers en la lista, este destacamento te da la mitad de sus reglas.`});
 if(detName==="Sekhetar Cohort"&&!has("Sekhetar Robots"))
  out.push({s:"bad",t:`<b>Sekhetar Cohort sin Sekhetar Robots.</b> Las tres Stratagems y la regla del destacamento los nombran explícitamente: sin ellos este destacamento está vacío.`});
 if(kw(d,"SCINTILLATING LEGIONS")&&detName==="Changehost of Deceit"&&!psykersInArmy)
  out.push({s:"bad",t:`<b>Demonios sin Psyker Thousand Sons.</b> Daemonic Illusions (invulnerable 4+ contra disparos) exige un THOUSAND SONS PSYKER amigo a 6" y visible. Sin él estos demonios son muy frágiles.`});

 /* --- combos entre unidades --- */
 if(kw(d,"VEHICLE")&&/PREDATOR/.test(d.kw.join(" "))&&psykersInArmy)

function weaponTables(d,L){
 const filt=arr=>L?arr.filter(w=>L[w.n]):arr;

/* Explica los perfiles alternativos que comparten una misma arma */
function profileNote(list){
 const names=list.map(w=>w.n);
 const has=t=>names.some(n=>new RegExp("–\\s*"+t,"i").test(n));
 const bits=[];
 if(has("Strike")||has("Sweep"))
  bits.push(`<b>Strike vs Sweep.</b> Son dos perfiles de la <b>misma</b> arma: eliges uno cada vez que la unidad lucha, nunca los dos. <b>Strike</b> = pocos ataques, mucha Fuerza/AP/Daño → úsalo contra vehículos, monstruos y terminadores. <b>Sweep</b> = muchos ataques, Daño 1-2 → úsalo contra unidades numerosas de 1-2 heridas, donde el Daño alto se desperdiciaría (matar un modelo de 1 herida con Daño 3 tira 2 puntos de daño a la basura).`);
 if(has("witchfire"))
  bits.push(`<b>Witchfire vs focused witchfire.</b> Mismo arma, dos perfiles. El <b>focused</b> pega más pero suele llevar HAZARDOUS: tras disparar tiras 1D6 y con un 1 el propio lanzador sufre 3 heridas mortales. Úsalo cuando el objetivo merezca el riesgo, no por rutina.`);
 if(has("krak")||has("frag"))
  bits.push(`<b>Krak vs frag.</b> Krak = un disparo de mucha Fuerza y Daño para vehículos; frag = varios disparos débiles con BLAST para infantería.`);
 if(has("blast")&&has("beam"))
  bits.push(`<b>Perfiles del Warp vortex.</b> <i>blast</i> para grupos, <i>beam</i> para un solo objetivo muy duro, <i>torrent</i> para impactar automáticamente a infantería cercana.`);
 return bits.length?`<div class="note">${bits.join("<br><br>")}</div>`:"";
}

/* Probabilidad de igualar o superar el WC con 2D6 y con 3D6 (Channel the Warp) */
function probTable(wc){
 const p2=prob(2,wc),p3=prob(3,wc);
 return `con 2D6: <b>${(p2*100).toFixed(0)}%</b> · haciendo Channel the Warp (3D6): <b>${(p3*100).toFixed(0)}%</b> <span class="small">(pero ~44% de sacar dobles/triples y sufrir D3 heridas mortales)</span>`;
}
function prob(n,target){
 // distribución de n D6
 let dist={0:1};
 for(let i=0;i<n;i++){const nd={};for(const k in dist)for(let f=1;f<=6;f++)nd[+k+f]=(nd[+k+f]||0)+dist[k];dist=nd}
 const tot=Math.pow(6,n);let ok=0;
 for(const k in dist)if(+k>=target)ok+=dist[k];
 return ok/tot;
}

/* ---- Utilidades para comprobar condiciones reales de la lista ---- */
function uIdx(name){const o=[];army.forEach((x,i)=>{if(x.u===name)o.push(i)});return o}
function optN(i,id){return (army[i].sel&&army[i].sel[id])||0}
/* Devuelve {ci,ui} si algún personaje charName está adjunto a una unidad unitName */
function attachedPair(charName,unitName){
 for(const ci of uIdx(charName)){
  const j=uIdx(unitName).find(k=>labelOf(k)===army[ci].join);
  if(j!==undefined)return {ci:ci,ui:j};
 }
 return null;
}
const cond=(ok,t)=>({ok:!!ok,t:t});

/* Cada condición se comprueba contra el tamaño y el armamento REALES */
const COMBO_CHECKS={
"Sorcerer in Terminator Armour + 10 Scarab Occult Terminators":()=>{
 const p=attachedPair("Sorcerer in Terminator Armour","Scarab Occult Terminators");
 const su=uIdx("Scarab Occult Terminators");
 const big=su.find(i=>sizeOf(army[i])>=10);
 return [
  cond(uIdx("Sorcerer in Terminator Armour").length,`Llevas un Sorcerer in Terminator Armour.`),
  cond(su.length,`Llevas Scarab Occult Terminators.`),
  cond(p,p?`El Sorcerer está adjunto a ${labelOf(p.ui)}.`:`El Sorcerer NO está adjunto a los Scarab Occult. Sin adjuntarlo no les da ni LETHAL HITS ni el +1 a impactar: hazlo desde su tarjeta en «Editar unidades».`),
  cond(big!==undefined,big!==undefined?`El bloque es de 10 modelos.`:`Tu bloque de Scarab es de ${su.length?sizeOf(army[su[0]]):0} modelos. <b>Con 5 el combo funciona igual pero rinde la mitad</b>: 10 disparos en vez de 20 (40 a media distancia). Sigue siendo bueno, solo menos decisivo.`)
 ];
},
"Infernal Master + 10 Rubric Marines con inferno boltguns + Infernal Fusillade":()=>{
 const p=attachedPair("Infernal Master","Rubric Marines");
 const bolts=p?(loadout(army[p.ui])["Inferno boltgun"]||0):0;
 const flam=p?(loadout(army[p.ui])["Warpflamer"]||0):0;
 return [
  cond(detName==="Rubricae Phalanx",detName==="Rubricae Phalanx"?`Estás en Rubricae Phalanx, que tiene Infernal Fusillade.`:`Infernal Fusillade es una Stratagem de <b>Rubricae Phalanx</b> y tú estás en <b>${detName}</b>. Sin ese destacamento pierdes la mitad del combo (el Infernal Master sigue dando SUSTAINED HITS 1).`),
  cond(p,p?`El Infernal Master está adjunto a ${labelOf(p.ui)}.`:`No tienes un Infernal Master adjunto a Rubric Marines.`),
  cond(p&&sizeOf(army[p.ui])>=10,p?(sizeOf(army[p.ui])>=10?`El bloque es de 10 modelos.`:`El bloque al que lo has adjuntado es de <b>${sizeOf(army[p.ui])} modelos</b>, no de 10. Con 5 modelos son ~8 disparos en vez de 18, así que gastar <b>2 CP</b> en Infernal Fusillade sobre esa unidad rinde muy poco: el combo pide masa.`):`—`),
  cond(bolts>=5,bolts>=5?`El bloque lleva ${bolts} inferno boltguns.`:`El bloque lleva solo <b>${bolts} inferno boltguns</b>${flam?` y ${flam} warpflamers`:""}. Infernal Fusillade <b>solo afecta a armas «inferno»</b>, y SUSTAINED HITS necesita tirada de impactar: con warpflamers este combo no funciona. Cambia los warpflamers por boltguns en esa unidad.`)
 ];
},

 return [
  cond(uIdx("Exalted Sorcerer").length,`Llevas un Exalted Sorcerer.`),
  cond(uIdx("Rubric Marines").length,`Llevas Rubric Marines.`),
  cond(p,p?`Está adjunto a ${labelOf(p.ui)}: toda la unidad tiene invulnerable 4+.`:`El Exalted Sorcerer no está adjunto a ningún bloque de Rubric Marines. Arcane Shield solo funciona «mientras lidere una unidad».`)
 ];
},
"Tzaangor Shaman + Enlightened with Fatecaster Greatbows (cazapersonajes)":()=>{
 const p=attachedPair("Tzaangor Shaman","Tzaangor Enlightened with Fatecaster Greatbows");
 return [
  cond(uIdx("Tzaangor Shaman").length,`Llevas un Tzaangor Shaman.`),
  cond(uIdx("Tzaangor Enlightened with Fatecaster Greatbows").length,`Llevas Enlightened con fatecaster greatbows.`),
  cond(p,p?`Está adjunto a ${labelOf(p.ui)}: los arcos impactan a 3+.`:`El Shaman no está adjunto a los Enlightened con arco. Bestial Prophet solo funciona «mientras lidere una unidad», y es justo donde más vale (BS 4+ → 3+).`)

"Magnus + Mutalith + Twist of Fate (romper armaduras)":()=>[
 cond(uIdx("Magnus the Red").length,`Llevas a Magnus: +2 al Psychic test y dos Rituales por turno.`),
 cond(uIdx("Mutalith Vortex Beast").length,uIdx("Mutalith Vortex Beast").length?`El Mutalith añade +1 al Channel the Warp a 6".`:`Sin Mutalith pierdes el +1 extra, pero <b>el combo ya funciona</b>: con el +2 de Magnus, Twist of Fate sale el 58% de las veces en vez del 28%.`),

 return [

  cond(best>0,best>0?`Tienes un bloque con ${best} warpflamers: ~${(best*3.5).toFixed(0)} impactos automáticos en Overwatch.`:`Ninguno de tus bloques lleva warpflamers. Con inferno boltguns, Fire Overwatch solo impacta con 6 naturales y el combo desaparece: sube el contador de warpflamers en una unidad.`)
 ];
},
"Cualquier Psyker + Chaos Predator (el disparo que prepara al tanque)":()=>[
 cond(uIdx("Chaos Predator Destructor").length||uIdx("Chaos Predator Annihilator").length,

 cond(army.some(x=>kw(ds(x.u),"PSYKER")),`Tienes Psykers que puedan impactar antes al objetivo.`)
],

 cond(detName==="Rubricae Phalanx",detName==="Rubricae Phalanx"?`Estás en Rubricae Phalanx.`:`Revenge of the Rubricae es de <b>Rubricae Phalanx</b>; estás en <b>${detName}</b>.`),
 cond(army.some(x=>kw(ds(x.u),"RUBRICAE")),`Llevas unidades RUBRICAE que puedan responder.`),
 cond(army.some(x=>kw(ds(x.u),"PSYKER")&&kw(ds(x.u),"CHARACTER")),`Llevas personajes PSYKER que sirvan de detonante.`)
],
"Maulerfiend como guardaespaldas de hechiceros":()=>[
 cond(uIdx("Maulerfiend").length,uIdx("Maulerfiend").length?`Llevas un Maulerfiend.`:`No llevas Maulerfiend.`),
 cond(army.some(x=>kw(ds(x.u),"PSYKER")&&kw(ds(x.u),"CHARACTER")),`Tienes hechiceros a los que proteger.`)
]
};

function comboState(cb){
 let conds;
 if(COMBO_CHECKS[cb.n]){try{conds=COMBO_CHECKS[cb.n]()}catch(e){conds=null}}
 if(!conds){
  conds=[cond(!cb.det||cb.det===detName,cb.det?`Destacamento ${cb.det}.`:`No requiere un destacamento concreto.`)]
   .concat(cb.need.map(n=>cond(army.some(x=>x.u===n),`${n} en la lista.`)));
 }
 conds=conds.filter(c=>c.t!=="—");
 const fails=conds.filter(c=>!c.ok);
 return {conds:conds,fails:fails,active:fails.length===0};
}

function comboBody(c,s){
 return `<div class="secbar">Requisitos comprobados en tu lista</div>
  ${s.conds.map(z=>`<div class="note ${z.ok?"ok":"warn"}">${z.ok?"✓ ":"✗ "}${z.t}</div>`).join("")}
  <div class="secbar">Cómo se ejecuta</div>
  <ol style="margin:6px 0;padding-left:22px">${c.how.map(h=>`<li style="margin:4px 0">${h}</li>`).join("")}</ol>
  <div class="secbar">Por qué funciona</div><p>${c.why}</p>
  <div class="secbar">Cuidado con</div><p class="small">${c.warn}</p>
  <div class="kwbar"><b>ORIGEN:</b> ${c.src}</div>`;
}
function renderCombos(){
 const st=COMBOS.map(c=>({c:c,s:comboState(c)}));
 const on=st.filter(z=>z.s.active),off=st.filter(z=>!z.s.active);
 /* Aplicable: tarjeta abierta y sin avisos */
 const openCard=(c,s)=>`<div class="ds"><div class="ds-head"><h3>${c.n}</h3><span class="pts">${c.tier}</span></div>
  <div class="ds-body"><div class="note ok"><b>✓ Aplicable con tu lista tal y como está.</b></div>
  ${comboBody(c,s)}</div></div>`;
 /* No aplicable: plegado, con el motivo exacto en el resumen */
 const shutCard=(c,s)=>`<details><summary>⚠ ${c.n} — ${s.fails.length} requisito${s.fails.length>1?"s":""} sin cumplir</summary>
  <div class="note warn"><b>Por qué no se aplica ahora:</b><br>${s.fails.map(f=>"• "+f.t).join("<br>")}</div>
  ${comboBody(c,s)}</details>`;
 $("combos").innerHTML=`<h2>🧩 Combos conocidos</h2>
 <div class="note">Los combos <b>aplicables con tu lista actual</b> salen desplegados y sin avisos. Los que no se cumplen quedan <b>plegados</b>: ábrelos para ver exactamente qué requisito falla y qué tendrías que cambiar. Los requisitos se comprueban contra el <b>tamaño real</b> de la unidad y el <b>armamento que has elegido</b>, no solo contra el nombre de la unidad.</div>
 ${on.length?`<div class="secbar">Aplicables ahora (${on.length})</div>`+on.map(z=>openCard(z.c,z.s)).join(""):`<div class="note warn">Ningún combo se cumple del todo con la lista actual. Abre los de abajo para ver qué falta.</div>`}
 ${off.length?`<div class="secbar">No aplicables todavía (${off.length})</div>`+off.map(z=>shutCard(z.c,z.s)).join(""):""}
 <div class="secbar">Anti-combos: buffs que se desperdician</div>
 <div class="note">Esto es lo que la app te avisa automáticamente en cada tarjeta de unidad. Aquí está el razonamiento completo.</div>
 ${ANTI.map(a=>`<div class="strat"><div class="strat-h"><b>${a.n}</b><span class="cp">evitar</span></div>
  <div class="strat-b"><p><span class="lbl">El problema</span> ${a.t}</p><p><span class="lbl">Qué hacer</span> ${a.fix}</p></div></div>`).join("")}`;
 applyGlossary($("combos"));
}

/* ---- Procedimiento de dados concreto para una unidad ---- */
function diceExpr(count,a){
 a=String(a).trim();
 if(/^\d+$/.test(a))return {txt:String(count*+a),avg:count*+a};
 const m=a.match(/^(\d*)D(\d+)(?:\s*\+\s*(\d+))?$/i);
 if(m){
  const n=(m[1]?+m[1]:1)*count,f=+m[2],add=(m[3]?+m[3]:0)*count;
  return {txt:n+"D"+f+(add?"+"+add:""),avg:n*(f+1)/2+add};
 }
 return {txt:a,avg:avgDice(a)*count};
}
/* Devuelve los pasos de dados de una unidad para una fase */
function procedure(i,melee){
 const c=ctxOf(i),active=availableBuffs(c).filter(b=>simBuffs[b.id]);
 const pool=attackPool(i).filter(p=>p.melee===melee);
 if(!pool.length)return `<p class="small">Esta unidad no tiene armas de ${melee?"combate":"distancia"}.</p>`;
 return pool.map(p=>{
  const K=effKeywords(p,c,active),m=modsFor(p,c,active,K);
  const hasK=q=>K.some(z=>z.indexOf(q)===0);
  const auto=hasK("TORRENT")||(melee?p.w.ws:p.w.bs)==="—";
  const d=diceExpr(p.count,p.w.a);
  let atk=d.txt,avgA=d.avg;
  if(!melee&&target.half&&hasK("RAPID FIRE")){
   const rf=NUM(K.find(z=>z.indexOf("RAPID FIRE")===0));
   atk+=" (+"+(rf*p.count)+" a media distancia)";avgA+=rf*p.count;
  }
  const skill=Math.max(2,NUM(melee?p.w.ws:p.w.bs)-m.hit);
  const s=(m.sSet?m.sSet:NUM(p.w.s))+m.s;
  const need=Math.max(2,woundNeed(s,target.t)-m.wound);
  const ap=Math.abs(NUM(p.w.ap))+m.ap;
  const dmg=avgDice(p.w.d)+m.d;
  const hits=auto?avgA:avgA*pOf(skill);
  const wounds=hits*pOf(need);
  let sv=target.sv+ap;
  if(target.cover&&!hasK("IGNORES COVER")&&!m.ic)sv-=1;
  const svFinal=target.inv?Math.min(sv,target.inv):sv;

  return `<div class="strat"><div class="strat-h"><b>${p.count}× ${p.w.n}</b><span class="cp">${p.w.r}</span></div>
  <div class="strat-b">
   <p><span class="lbl">1 · Alcance</span> ¿Está el enemigo a <b>${p.w.r}</b>${melee?"":" y visible"}? Si no, esta arma no puede disparar.</p>
   <p><span class="lbl">2 · Ataques</span> Tira <b>${atk}</b> ${/D/.test(atk)?`dados de ataque (media ~${avgA.toFixed(1)})`:"ataques"}.</p>
   <p><span class="lbl">3 · Impactar</span> ${auto
     ? `<b>No tiras para impactar.</b> Esta arma tiene TORRENT: esos ~${avgA.toFixed(1)} ataques son impactos <b>automáticos</b>. Pasa directamente a herir.`
     : `Tira esos ${Math.round(avgA)} dados: impactas con <b>${skill}+</b>${m.hit?` (incluye +${m.hit} a impactar)`:""}. Esperas ~<b>${hits.toFixed(1)}</b> impactos.`}
     ${hasK("SUSTAINED HITS")||m.sustained?`<br><span class="small">Cada <b>6 natural</b> genera impactos extra (SUSTAINED HITS).</span>`:""}
     ${hasK("LETHAL HITS")||m.lethal?`<br><span class="small">Cada <b>6 natural</b> hiere automáticamente: aparta esos dados, no tiran para herir (LETHAL HITS).</span>`:""}</p>

     ${(hasK("DEVASTATING WOUNDS")||m.dev)?`<br><span class="small">Los <b>6 naturales al herir</b> se convierten en <b>heridas mortales</b>: no se salvan (DEVASTATING WOUNDS). Sepáralos.</span>`:""}
     ${hasK("TWIN-LINKED")||m.rrW?`<br><span class="small">Puedes repetir la tirada de herir.</span>`:""}</p>
   <p><span class="lbl">5 · Salvación</span> El rival salva con <b>${svFinal>=7?"nada, no puede salvar":svFinal+"+"}</b> (Sv ${target.sv}+ empeorada por AP -${ap}${target.cover?", con cobertura":""}${target.inv?`, o su invulnerable ${target.inv}+ si es mejor`:""}).</p>

/* ---- Tabla de herir: matriz S × T con ramp ordinal de un solo tono ---- */
let wtS=4,wtT=4;
const WCLASS={2:"w2",3:"w3",4:"w4",5:"w5",6:"w6"};
function woundTable(){
 const S=[];for(let s=2;s<=16;s++)S.push(s);
 const T=[];for(let t=1;t<=13;t++)T.push(t);
 const head=`<tr><th class="cnr rh">S \\ T</th>${T.map(t=>`<th>${t}</th>`).join("")}</tr>`;
 const body=S.map(s=>`<tr><th class="rh">S${s}</th>${T.map(t=>{
   const n=woundNeed(s,t);
   const hl=(s===wtS&&t===wtT)?" hl":"";
   return `<td class="${WCLASS[n]}${hl}" title="S${s} contra T${t}: hieres con ${n}+">${n}+</td>`;
  }).join("")}</tr>`).join("");
 return `<div class="wt-legend" data-noglossary>
   <span><i class="w2"></i>2+ muy fácil</span><span><i class="w3"></i>3+ fácil</span>
   <span><i class="w4"></i>4+ mitad</span><span><i class="w5"></i>5+ difícil</span>
   <span><i class="w6"></i>6+ muy difícil</span></div>
  <div class="wt-wrap"><table class="wt"><thead>${head}</thead><tbody>${body}</tbody></table></div>
  <p class="small">Busca la fila de la Fuerza de tu arma y la columna de la Resistencia del objetivo. En 11ª nunca hay «no puedo herir»: el peor caso es 6+.
  La regla que resume la tabla: <b>S ≥ 2×T → 2+ · S &gt; T → 3+ · S = T → 4+ · S &lt; T → 5+ · S×2 ≤ T → 6+</b>.
  Después de herir aplica el AP a la salvación del rival y compara con su invulnerable: se usa la mejor de las dos, nunca ambas.</p>`;
}
function wtAnswer(){
 const n=woundNeed(wtS,wtT),p=Math.round((7-n)/6*100);
 return `<div class="bigans">${n}+</div>
  <div class="small">Un arma de <b>S${wtS}</b> contra un objetivo de <b>T${wtT}</b> hiere con <b>${n} o más</b> en 1D6: acierta el <b>${p}%</b> de las tiradas de herir.
  De 10 impactos esperarías ${(p/10).toFixed(1)} heridas antes de la salvación.</div>`;
}
function setWT(k,v){
 if(k==="s")wtS=Math.max(1,Math.min(20,+v||1));else wtT=Math.max(1,Math.min(14,+v||1));
 const a=document.getElementById("wtAns");
 if(a){a.innerHTML=wtAnswer();applyGlossary(a)}
 document.querySelectorAll("table.wt td.hl").forEach(e=>e.classList.remove("hl"));
 const rows=document.querySelectorAll("table.wt tbody tr");
 const ri=wtS-2,ci=wtT-1;
 if(rows[ri]){const c=rows[ri].querySelectorAll("td")[ci];if(c)c.classList.add("hl")}
}

/* =========================================================================

   ========================================================================= */
function readSlots(){try{return JSON.parse(localStorage.getItem("ts11slots_v7")||"{}")}catch(e){return {}}}
function writeSlots(s){try{localStorage.setItem("ts11slots_v7",JSON.stringify(s))}catch(e){alert("No he podido guardar: el almacenamiento del navegador está lleno o bloqueado.")}}
function saveSlot(){
 const el=$("slotName");
 let n=(el.value||"").trim();
 if(!n)n=detName+" "+total()+"pts";
 const s=readSlots();
 if(s[n]&&!confirm("Ya existe una lista guardada llamada «"+n+"». ¿Sobrescribirla?"))return;
 s[n]={detachment:detName,limit:lim(),army:JSON.parse(JSON.stringify(army)),saved:new Date().toISOString()};
 writeSlots(s);el.value="";renderSlots();
}
function loadSlot(n){
 const s=readSlots()[n];
 if(!s)return;
 if(!confirm("Cargar «"+n+"»? Se reemplaza la lista que tienes ahora en pantalla."))return;
 army=migrate(s.army);
 if(s.detachment&&DET[s.detachment])detName=s.detachment;
 if(s.limit)$("limit").value=s.limit;
 simAttacker=0;save();renderAll();
}
function delSlot(n){
 if(!confirm("¿Borrar la lista guardada «"+n+"»? Esto no se puede deshacer."))return;
 const s=readSlots();delete s[n];writeSlots(s);renderSlots();
}
function renderSlots(){
 const s=readSlots(),names=Object.keys(s).sort();
 $("slots").innerHTML=names.length?names.map(n=>{
  const pts=(s[n].army||[]).length;
  const when=s[n].saved?new Date(s[n].saved).toLocaleDateString("es-ES"):"";
  return `<div class="listrow"><div><b>${esc(n)}</b><div class="small">${s[n].detachment||"?"} · ${pts} unidades · ${s[n].limit||"?"} pts${when?" · "+when:""}</div></div>
   <button onclick="loadSlot(${JSON.stringify(n).replace(/"/g,"&quot;")})">Cargar</button>
   <button class="danger" onclick="delSlot(${JSON.stringify(n).replace(/"/g,"&quot;")})">×</button></div>`;
 }).join(""):`<p class="small">Todavía no has guardado ninguna lista. Se guardan en este navegador; usa «Exportar JSON» si quieres llevártelas a otro equipo.</p>`;
}

 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="thousand-sons-11e-army.json";a.click();

function importJSON(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{
  const z=JSON.parse(r.result);
  army=migrate(z.army||z);
  if(z.detachment&&DET[z.detachment])detName=z.detachment;
  if(z.limit)$("limit").value=z.limit;
  save();renderAll();
 }catch(e){alert("JSON no válido")}};
 r.readAsText(f);
}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function importArmy(){
 const s=$("importText").value;if(!s.trim())return;
 const found=[];
 NAMES.forEach(n=>{
  const re=new RegExp("(?:^|\\n)\\s*(\\d+)?\\s*[x×]?\\s*"+escRe(n),"i");
  const m=s.match(re);
  if(m){
   const d=DS[n],q=m[1]?+m[1]:0;
   const size=d.sizes.find(z=>z.m===q)?q:d.sizes[0].m;
   found.push({u:n,size:size,sel:{},enh:"",join:""});
  }
 });
 if(!found.length)return alert("No he reconocido ninguna unidad. Pega la exportación completa de tu app de listas.");
 // armamento y mejoras por bloques
 let cur=null;
 s.split(/\r?\n/).forEach(raw=>{
  const line=raw.trim();if(!line)return;
  const hit=NAMES.find(n=>line.toLowerCase().indexOf(n.toLowerCase())>=0);
  if(hit){cur=found.find(z=>z.u===hit)||cur;return}
  if(!cur)return;
  const d=DS[cur.u];
  const wm=line.match(/^[•\-*]?\s*(\d+)?\s*(.+?)\s*$/);
  if(wm){
   const qty=wm[1]?+wm[1]:1,nm=wm[2].toLowerCase().replace(/\(.*?\)/g,"").trim();
   const o=(d.opts||[]).find(z=>nm.indexOf(z.n.toLowerCase())>=0||z.n.toLowerCase().indexOf(nm)>=0);
   if(o){cur.sel[o.id]=Math.min(qty,typeof o.max==="function"?o.max(cur.size,cur.sel,cur):o.max||1)}
  }
  const em=line.match(/(?:Mejora|Enhancement)\s*[:\-]?\s*(.+)/i);
  if(em){
   const nm=em[1].replace(/\(.*?\)/g,"").trim().toLowerCase();
   const e=(DET[detName].enh||[]).find(z=>z.n.toLowerCase()===nm);
   if(e)cur.enh=e.n;
  }
 });
 army=migrate(found);save();renderAll();
}

/* =========================================================================
   16. ARRANQUE
   ========================================================================= */
/* Las pestañas secundarias se dibujan solo al abrirlas: así los contadores de
   armamento responden al instante aunque el catálogo tenga 35 datasheets. */
const RENDERERS={builder:renderBuilder,codex:renderCodex,detachment:renderDetachment,
 rituals:renderRituals,combos:renderCombos,catalog:renderCatalog,coach:renderCoach,rules:renderRules};
let dirty={},activeTab="builder";
function renderTab(t){if(RENDERERS[t]){RENDERERS[t]();dirty[t]=false}}
function renderAll(){
 army.forEach(clampSel);
 $("det").value=detName;
 renderKpis();renderArmyList();renderSlots();
 Object.keys(RENDERERS).forEach(k=>dirty[k]=true);
 renderTab(activeTab);
}

$("det").innerHTML=Object.keys(DET).map(n=>`<option>${n}</option>`).join("");
$("det").value=detName;
$("addPick").innerHTML=NAMES.map((n,i)=>`<option value="${i}">${n}${DS[n].legends?" (Legends)":""}</option>`).join("");
$("det").onchange=()=>{
 detName=$("det").value;
 army.forEach((x,i)=>{
  if(!x.enh)return;
  const st=enhStatus(x,i).find(z=>z.e.n===x.enh);
  if(!st||!st.legal)x.enh="";
 });
 save();renderAll();
};
$("limit").onchange=()=>{save();renderAll()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(z=>z.classList.remove("active"));
 b.classList.add("active");
 document.querySelectorAll(".pane").forEach(z=>z.classList.add("hidden"));
 activeTab=b.dataset.t;
 $(activeTab).classList.remove("hidden");
 if(dirty[activeTab]!==false)renderTab(activeTab);
 hideTip();
});
autoGlossary();
buildGlossaryIndex();
renderAll();
</script>
